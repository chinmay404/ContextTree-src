<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · Context Tree</title>
<style>
  :root { color-scheme: light dark; --bg: #F5F5F7; --ink: #1D1D1F; --muted: #68686D; --btn: #1D1D1F; --on: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #F5F5F7; --muted: #AEAEB2; --btn: #F5F5F7; --on: #000000; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, -apple-system, sans-serif; text-align: center; }
  h1 { margin: 16px 0 6px; font-size: 26px; letter-spacing: -.02em; }
  p { margin: 0 0 22px; color: var(--muted); max-width: 34ch; }
  img { border-radius: 16px; }
  button { padding: 11px 22px; border: 0; border-radius: 999px; background: var(--btn); color: var(--on); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="64" height="64" alt="">
    <h1>You're offline</h1>
    <p>Your boards are saved online. They'll be here as soon as you reconnect.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
