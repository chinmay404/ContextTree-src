<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board prototype v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ======================================================
   Tokens — from "Context nodes · UI vocabulary"
   ====================================================== */
:root {
  --canvas: #141311; --grid: #24231F; --node: #1C1B19; --raised: #262522; --border: #2E2D2A; --edge: #55555C; --paper: #EFE9DA;
  --t1: #E8E6E1; --t2: #A19E96; --t3: #8A877F; --t-prompt: #DCD9D2; --t-body: #C9C6BF;
  --signal: #F25A1A; --signal-2: #F2733A; --ready: #3FBF7F; --outdated: #E0B84A; --failed: #FF7A66; --muted: #3A3936;
  --media: #B38CFF; --web: #6FB3FF; --docs: #E8E6E1; --data: #3FBF7F; --place: #5FD0C8;
  --well-media: #241D33; --well-web: #172230; --well-docs: #262522; --well-data: #16241C;
  --sh: 0 10px 30px -14px rgba(0,0,0,.7);
  --sh-lift: 0 2px 6px rgba(0,0,0,.35), 0 30px 60px -16px rgba(0,0,0,.85);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  font-family: Geist, system-ui, sans-serif; color: var(--t1); -webkit-font-smoothing: antialiased; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.i { width: var(--s, 16px); height: var(--s, 16px); flex: none; display: inline-block; background: var(--c, var(--t2)); -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat; }
.mono { font-family: 'Geist Mono', monospace; }
.meta { font: 400 10px/1.2 'Geist Mono', monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font: 400 10px/1 'Geist Mono', monospace; padding: 3px 5px; border-radius: 4px; flex: none; background: var(--raised); color: var(--t-prompt); }
.chip.media { background: #2A2433; color: #C9B3FF; } .chip.data { background: #16301F; color: #7FE0AA; } .chip.web { background: #17283A; color: #A9D0FF; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes edgeflow { to { stroke-dashoffset: -24; } }
@keyframes caret { 50% { opacity: 0; } }

/* ======================================================
   Board
   ====================================================== */
#vp { position: fixed; inset: 0; background-color: var(--canvas); background-image: radial-gradient(#2A2926 1px, transparent 1.2px); touch-action: none; }
#vp.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; z-index: 1; pointer-events: none; }
#edges path { fill: none; stroke-linecap: round; transition: stroke 200ms ease, stroke-width 200ms ease, opacity 200ms ease; }
#edges .hit { stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
#edges .e { stroke: var(--edge); stroke-width: 3; }
#edges .e.bundled { stroke-width: 7; }
#edges .e.outdated { stroke: var(--outdated); }
#edges .e.sel { stroke: var(--signal); }
#edges .e.reading { stroke: var(--signal); stroke-dasharray: 8 4; animation: edgeflow .9s linear infinite; }
#edges .e.pending { stroke-dasharray: 1 8; }
#edges .e.muted { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 8 6; }
#edges .e.broken { stroke: var(--failed); stroke-width: 2.5; stroke-dasharray: 8 6; }
#edges .e.faded { opacity: .22; }
#edges .lin { stroke: #3E3D3A; stroke-width: 2; }
#edges .lin.sel { stroke: var(--t3); }
#edges .lin.faded { opacity: .3; }
#chips { position: absolute; left: 0; top: 0; z-index: 99990; pointer-events: none; }
.echip { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; font: 400 10px/1 'Geist Mono', monospace; background: var(--raised); border: 1px solid #3A3936; color: var(--t-prompt); padding: 3px 6px; border-radius: 4px; white-space: nowrap; transition: opacity 200ms ease; }
.echip.x { width: 20px; height: 20px; border-radius: 10px; padding: 0; display: grid; place-items: center; background: #2A1D1B; border-color: var(--failed); }
.echip.faded { opacity: .25; }
.emenu { position: absolute; transform: translate(-50%, calc(-100% - 12px)); pointer-events: auto; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--node); border: 1px solid var(--border); box-shadow: var(--sh-lift); opacity: 0; scale: .97; transform-origin: 50% 100%; transition: opacity 140ms ease-out, scale 160ms var(--ease-out); }
.emenu.open { opacity: 1; scale: 1; }
.emenu button { height: 28px; padding: 0 9px; border-radius: 7px; font-size: 12px; color: var(--t2); display: inline-flex; align-items: center; gap: 6px; transition: background-color 150ms ease, color 150ms ease, transform 120ms var(--ease-out); }
.emenu button:active { transform: scale(.95); }
@media (hover: hover) and (pointer: fine) { .emenu button:hover { background: var(--raised); color: var(--t1); } }

/* ======================================================
   Nodes
   ====================================================== */
.card { position: absolute; left: 0; top: 0; will-change: transform; z-index: 2; transition: opacity 220ms ease; }
.card.faded { opacity: .5; }
.face { position: relative; background: var(--node); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--sh); cursor: grab; transition: box-shadow 240ms var(--ease-out), border-color 200ms ease; }
.card.lift .face { box-shadow: var(--sh-lift); cursor: grabbing; }
.card.selected .face { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal), var(--sh-lift); }
.card.lit .face { border-color: #4A3226; }
.card.drop .face { border: 1.5px solid var(--signal); box-shadow: 0 0 0 4px rgba(242,90,26,.13), var(--sh-lift); background: #1F1D1B; }
.sheet { position: absolute; height: 100%; border-radius: 12px; background: #1A1917; border: 1px solid #2C2B28; }
.sheet.s1 { left: 8px; right: 8px; top: -6px; }
.sheet.s2 { left: 16px; right: 16px; top: -12px; background: #191816; border-color: #2A2926; }
.card.drop .sheet.s2, .card.drop .sheet.s1:only-of-type { border: 1px dashed rgba(242,90,26,.4); }

/* M · excerpt card 340 × 120 */
.m { height: 120px; padding: 12px; display: flex; gap: 12px; }
.m.wide { }
.well { width: 88px; height: 96px; flex: none; border-radius: 8px; background: var(--well-docs); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.m .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.m .title { font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .ex { display: flex; gap: 6px; align-items: flex-start; }
.m .ex span:last-child { font-size: 12px; line-height: 1.4; color: var(--t2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.st { display: inline-flex; align-items: center; gap: 6px; }
.st.proc { color: var(--t2); } .st.fail { color: var(--failed); } .st.out { color: var(--outdated); }
.st .i { --s: 12px; }
.st.proc .i { animation: spin 1s linear infinite; }
.retry { font-size: 12px; font-weight: 500; color: var(--t1); text-decoration: underline; text-underline-offset: 2px; }

/* type miniatures */
.pg { width: 58px; height: 78px; background: #F4F3EF; border-radius: 2px; padding: 8px 7px; display: flex; flex-direction: column; gap: 3px; }
.pg b { height: 4px; background: #2A2724; border-radius: 1px; width: 82%; margin-bottom: 2px; }
.pg span { height: 2px; background: #C9C5BB; border-radius: 1px; }
.pg span:nth-child(4n) { width: 66%; }
.wave { display: flex; align-items: center; gap: 2px; height: 100%; padding: 0 8px; }
.wave i { width: 3px; border-radius: 2px; background: var(--media); }
.wave i.past { background: #6B5A8A; } .wave i.at { background: var(--signal); }
.vframe { position: absolute; inset: 10px 8px 22px; border-radius: 5px; background: #1A1526; display: grid; place-items: center; }
.vbar { position: absolute; left: 8px; right: 8px; bottom: 12px; height: 3px; border-radius: 2px; background: #3A2F4E; }
.vbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 64%; border-radius: 2px; background: var(--media); }
.vbar b { position: absolute; top: -3px; width: 3px; height: 9px; border-radius: 1px; background: var(--signal); left: 64%; }
.browser { position: absolute; inset: 10px 8px; border-radius: 5px; background: #1D2B3B; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.browser .dots { display: flex; gap: 2px; margin-bottom: 2px; } .browser .dots i { width: 4px; height: 4px; border-radius: 2px; background: #3E5670; }
.browser b { height: 4px; border-radius: 1px; background: var(--web); opacity: .85; }
.browser span { height: 2px; border-radius: 1px; background: #3E5670; }
.grid { position: absolute; inset: 12px 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; align-content: start; }
.grid i { height: 7px; border-radius: 1px; background: #24382C; } .grid i.h { background: var(--data); opacity: .8; }
.minis { display: flex; gap: 4px; }
.minis i { width: 22px; height: 30px; border-radius: 2px; background: #F4F3EF; } .minis i:nth-child(2) { background: #E4E1D8; } .minis i:nth-child(1) { background: #CFCBC2; }

/* note: paper surface */
.card.note .face { background: var(--paper); border-color: #D9D1BD; color: #2A2724; }
.card.note.selected .face { border-color: var(--signal); }
.note-in { padding: 12px 14px 14px; min-height: 120px; display: flex; flex-direction: column; gap: 6px; }
.note-in .meta { color: #8C836F; }
.note-in .n { font-size: 14px; line-height: 1.45; outline: none; cursor: text; user-select: text; min-height: 40px; }
.note-in .n:empty::before { content: 'Write a note…'; color: #9C9380; }

/* L · opened in place */
.l { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.l .top { display: flex; gap: 12px; }
.l .top .well { height: 64px; }
.l .div { height: 1px; background: var(--border); }
.exl { display: flex; flex-direction: column; gap: 4px; }
.exl button { display: flex; gap: 8px; align-items: flex-start; text-align: left; padding: 5px 6px; margin: 0 -6px; border-radius: 6px; transition: opacity 200ms ease, background-color 150ms ease; }
.exl button span:last-child { font-size: 12px; line-height: 1.4; color: var(--t-body); }
.exl button.off { opacity: .45; } .exl button.off span:last-child { text-decoration: line-through; color: var(--t2); }
.exl button.off .chip { background: var(--raised); color: var(--t2); }
@media (hover: hover) and (pointer: fine) { .exl button:hover { background: var(--raised); } }
.lfoot { display: flex; gap: 6px; font-size: 11px; color: var(--t2); align-items: center; }
.lfoot .used { background: var(--raised); padding: 4px 8px; border-radius: 6px; }
.lfoot button { padding: 4px 4px; color: var(--t2); } .lfoot button:hover { color: var(--t1); }

/* S · pill 44h (low zoom) */
.s { height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 6px; }
.s .dot { width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.s .t { flex: 1; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s .cnt { font: 400 11px 'Geist Mono', monospace; color: var(--t3); background: var(--raised); padding: 2px 6px; border-radius: 8px; flex: none; }
.card.size-s .face { border-radius: 22px; }
.card.size-s .sheet { border-radius: 22px; }

/* chat node */
.chat-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; min-height: 34px; }
.chat-h .md { width: 8px; height: 8px; border-radius: 4px; background: var(--c); flex: none; }
.chat-h .title { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; }
.chat-h .meta.live { color: var(--signal-2); }
.chat-h .meta.out { color: var(--outdated); }
.cbody { max-height: 360px; overflow: auto; padding: 12px 14px 14px; cursor: auto; user-select: text; scrollbar-width: thin; scrollbar-color: #3A3936 transparent; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(#000 calc(100% - 26px), transparent); mask-image: linear-gradient(#000 calc(100% - 26px), transparent); }
.cbody.short { -webkit-mask-image: none; mask-image: none; }
.mu { display: inline-block; max-width: 94%; background: var(--raised); border-radius: 10px; padding: 8px 11px; font-size: 14px; line-height: 1.45; color: var(--t-prompt); margin: 0 0 12px; }
.ma { font-size: 13px; line-height: 1.55; color: var(--t2); margin-bottom: 12px; }
.ma h3 { font-size: 13px; font-weight: 600; color: var(--t1); margin: 12px 0 3px; }
.ma h3:first-child { margin-top: 0; }
.ma p { margin: 0 0 8px; } .ma ol { margin: 0 0 8px; padding-left: 18px; } .ma li { margin-bottom: 3px; } .ma b { color: var(--t1); font-weight: 600; }
.ma.live p:last-child::after { content: ''; display: inline-block; width: 6px; height: 13px; margin-left: 2px; vertical-align: -2px; background: var(--signal); animation: caret 900ms steps(1) infinite; }
.cempty { font-size: 13px; line-height: 1.5; color: var(--t3); }
.compose { border-top: 1px solid var(--border); padding: 10px 10px 8px 14px; display: none; cursor: auto; }
.card.selected .compose, .card.empty .compose { display: block; }
.compose textarea { width: 100%; border: 0; outline: none; resize: none; font: inherit; font-size: 14px; line-height: 1.45; background: none; color: var(--t1); min-height: 22px; max-height: 120px; }
.compose textarea::placeholder { color: var(--t3); }
.cbar { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.send { width: 28px; height: 28px; border-radius: 14px; background: var(--signal); display: grid; place-items: center; margin-left: auto; transition: transform 120ms var(--ease-out), opacity 150ms ease; flex: none; }
.send .i { --c: #140A05; --s: 14px; }
.send:active { transform: scale(.92); }
.send:disabled { opacity: .25; cursor: default; }

/* ports — 10 × 16, overhang 6 */
.port { position: absolute; width: 10px; height: 16px; border-radius: 4px; top: var(--py); margin-top: -8px; background: var(--signal); z-index: 3; cursor: crosshair; transition: width 160ms var(--ease-out), height 160ms var(--ease-out), margin 160ms var(--ease-out), box-shadow 160ms ease, opacity 160ms ease; display: grid; place-items: center; }
.port.pr { right: -6px; } .port.pl { left: -6px; }
.port.free { background: transparent; box-shadow: inset 0 0 0 2px var(--signal); }
.port.notready { background: var(--muted); }
.port.failed { background: var(--canvas); box-shadow: inset 0 0 0 2px var(--muted); cursor: default; }
.port.plin { background: #4A4945; }
.port.target { outline: 2px dashed rgba(242,90,26,.55); outline-offset: 6px; }
.port::before { content: ''; position: absolute; inset: -8px; }
.port::after { content: '+'; font: 700 12px/1 Geist; color: #140A05; opacity: 0; transition: opacity 120ms ease; }
@media (hover: hover) and (pointer: fine) {
  .port:not(.failed):hover, .port.grab { width: 14px; height: 22px; margin-top: -11px; box-shadow: 0 0 0 4px rgba(242,90,26,.2); background: var(--signal); }
  .port.pr:not(.failed):hover, .port.pr.grab { right: -8px; } .port.pl:not(.failed):hover { left: -8px; }
  .port:not(.failed):hover::after, .port.grab::after { opacity: 1; }
}

/* toolbar above selected node */
.tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 1px; padding: 2px; border-radius: 8px; background: var(--node); box-shadow: -10px 0 12px -4px var(--node); opacity: 0; pointer-events: none; transition: opacity 140ms ease-out; z-index: 2; }
.card.selected .tools { opacity: 1; pointer-events: auto; }
@media (hover: hover) and (pointer: fine) { .card:hover .tools { opacity: 1; pointer-events: auto; } }
.card.note .tools { background: var(--paper); box-shadow: -10px 0 12px -4px var(--paper); }
.card.note .tb .i { --c: #6B6352; }
.tb { width: 26px !important; height: 26px !important; }
.tb { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; transition: background-color 150ms ease, transform 120ms var(--ease-out); }
.tb .i { --c: var(--t2); transition: background-color 150ms ease; }
.tb:active { transform: scale(.92); }
@media (hover: hover) and (pointer: fine) { .tb:hover { background: var(--raised); } .tb:hover .i { --c: var(--t1); } }

/* selection → branch */
#selbranch { position: fixed; z-index: 30; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--signal); color: #140A05; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; opacity: 0; transform: translateY(4px) scale(.97); transform-origin: 50% 100%; pointer-events: none; transition: opacity 140ms ease-out, transform 160ms var(--ease-out); }
#selbranch .i { --c: #140A05; --s: 14px; }
#selbranch.show { opacity: 1; transform: none; pointer-events: auto; }

/* ======================================================
   Chrome
   ====================================================== */
.bar { background: rgba(28,27,25,.78); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--border); box-shadow: 0 12px 32px -12px rgba(0,0,0,.7); }
@media (prefers-reduced-transparency: reduce) { .bar { background: var(--node); backdrop-filter: none; } }
#top { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 20; }
#top > * { pointer-events: auto; }
.crumbs { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 7px; border-radius: 12px; font-size: 13px; }
.crumbs .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--signal); display: grid; place-items: center; }
.crumbs .logo .i { --c: #140A05; --s: 15px; }
.crumbs .mu2 { color: var(--t3); } .crumbs strong { font-weight: 600; }
.rp { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 5px; border-radius: 12px; }
.pb { height: 30px; padding: 0 11px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--t2); display: inline-flex; align-items: center; gap: 6px; transition: background-color 150ms ease, color 150ms ease, transform 120ms var(--ease-out); }
.pb:active { transform: scale(.96); }
@media (hover: hover) and (pointer: fine) { .pb:hover { background: var(--raised); color: var(--t1); } }
#dock { position: fixed; left: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; padding: 5px; border-radius: 14px; z-index: 20; }
#dock button { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; transition: background-color 150ms ease, transform 120ms var(--ease-out); }
#dock button .i { --s: 18px; }
#dock button:active { transform: scale(.92); }
#dock .sep { height: 1px; margin: 4px 8px; background: var(--border); }
@media (hover: hover) and (pointer: fine) { #dock button:hover { background: var(--raised); } }
.tip { position: fixed; z-index: 100; pointer-events: none; background: var(--t1); color: var(--canvas); font-size: 12px; font-weight: 500; padding: 5px 8px; border-radius: 7px; white-space: nowrap; opacity: 0; transform: translateY(4px) scale(.97); transform-origin: 50% 100%; transition: opacity 125ms ease-out, transform 125ms var(--ease-out); }
.tip.show { opacity: 1; transform: none; } .tip.instant { transition-duration: 0ms; }
.tip kbd { font: 500 11px 'Geist Mono', monospace; opacity: .55; margin-left: 6px; }
#zoom { position: fixed; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; z-index: 20; }
#zoom button { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; transition: background-color 150ms ease, transform 120ms var(--ease-out); }
#zoom button:active { transform: scale(.92); }
#zoom .z { width: 46px; font: 500 12px 'Geist Mono', monospace; color: var(--t2); text-align: center; }
@media (hover: hover) and (pointer: fine) { #zoom button:hover { background: var(--raised); } }
#hint { position: fixed; left: 18px; bottom: 18px; font-size: 12px; color: var(--t3); z-index: 20; line-height: 1.6; max-width: 310px; }
#hint b { color: var(--t2); font-weight: 600; }

/* ======================================================
   Full-screen node
   ====================================================== */
#scrim { position: fixed; inset: 0; background: rgba(5,5,4,.55); opacity: 0; pointer-events: none; z-index: 40; }
#reader { position: fixed; inset: 0; z-index: 50; display: none; background: var(--node); }
#reader .in { position: absolute; inset: 12px; display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 56px 1fr; }
.r-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; border-bottom: 1px solid var(--border); }
.r-crumb { font-size: 13px; color: var(--t3); display: flex; align-items: center; gap: 8px; min-width: 0; }
.r-crumb strong { color: var(--t1); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-crumb .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.r-sp { flex: 1; }
.r-top kbd { font: 500 10px 'Geist Mono', monospace; color: var(--t3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.mbtn { height: 32px; padding: 0 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); transition: background-color 150ms ease, transform 120ms var(--ease-out); }
.mbtn .md { width: 8px; height: 8px; border-radius: 4px; background: var(--c); }
.mbtn:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .mbtn:hover { background: var(--raised); } }

  nodes.forEach(n => { n.el.classList.toggle('faded', !!focus && !rel.has(n.id)); n.el.classList.toggle('lit', !!sel && rel.has(n.id) && n.id !== id); });
  if (sel) sel.el.style.zIndex = ++zTop;
  hideSel();
}

/* ---------- select text → branch ---------- */
const sbBtn = document.getElementById('selbranch'); let selCtx = null;
document.addEventListener('pointerup', () => setTimeout(() => {
  const s = getSelection(), txt = s && s.toString().trim();
  if (!txt || txt.length < 3) return hideSel();
  const node = s.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement);
  const body = node?.closest('.cbody, .rma'); if (!body) return hideSel();
  const id = body.closest('.card')?.dataset.id || reader.id; if (!id) return;
  const r = s.getRangeAt(0).getBoundingClientRect();
  selCtx = { id, txt: txt.slice(0, 160) };
  sbBtn.style.left = (r.left + r.width / 2 - 72) + 'px'; sbBtn.style.top = (r.top - 40) + 'px'; sbBtn.classList.add('show');
}, 0));
function hideSel() { sbBtn.classList.remove('show'); }
sbBtn.addEventListener('click', () => {
  if (!selCtx) return; const { id, txt } = selCtx; hideSel(); getSelection().removeAllRanges();
  const go = () => { const b = branch(id, null, txt); select(b.id); focusCompose(b); };
  reader.id ? (closeReader(), setTimeout(go, RM ? 0 : 300)) : go();
});

/* ---------- chat ---------- */
function replyFor(c) {
  const s = incoming(c.id).filter(e => !e.muted && nodes.get(e.from).status !== 'failed').map(e => nodes.get(e.from)).map(x => x.type === 'note' ? 'your note' : x.title);
  const lead = s.length ? `Going by ${s.slice(0, 2).join(' and ')}${s.length > 2 ? `, plus ${s.length - 2} more` : ''}: ` : c.parent ? 'From the summary of the parent chat: ' : 'With nothing wired in, going only on this conversation: ';
  return `<p>${lead}keep the free tier and test the $12 plan with ten real users before you decide. Ask what they'd pay before you show a number.</p><p>If most say under $10, lead with the one-time licence instead.</p>`;
}
function send(c, text) {
  c.msgs.push({ r: 'u', t: text }); const ai = { r: 'a', t: '', live: true }; c.msgs.push(ai);
  c.streaming = true; incoming(c.id).forEach(e => e.outdated = false);
  render(c); scrollEnd(c); if (reader.id === c.id) renderThread(c);
  const full = replyFor(c), words = strip(full).split(' '); let i = 0;
  const tick = () => {
    i = Math.min(words.length, i + 2); ai.t = `<p>${esc(words.slice(0, i).join(' '))}</p>`;
    const el = c.el.querySelector('.ma.live'); if (el) el.innerHTML = ai.t;
    const rel = reader.id === c.id && document.querySelector('#reader .rma.live'); if (rel) rel.innerHTML = ai.t;
    scrollEnd(c);
    if (i < words.length) setTimeout(tick, 55);

  };

}
function scrollEnd(c) { const b = c.el.querySelector('.cbody'); if (b) { b.scrollTop = b.scrollHeight; b.classList.toggle('short', b.scrollHeight <= b.clientHeight + 2); } const r = reader.id === c.id && document.querySelector('#reader .r-scroll'); if (r) r.scrollTop = r.scrollHeight; }
function branch(pid, at, quote) {
  const p = nodes.get(pid), kids = lins.filter(l => l.parent === pid).length;
  const d = { id: 'b' + (++uid), type: 'chat', model: p.model, parent: pid, w: 380, msgs: [], title: quote ? (quote.length > 34 ? quote.slice(0, 32).trim() + '…' : quote) : 'New branch', x: at ? at.x : p.px.t + p.w + 120, y: at ? at.y : p.py.t + 80 + kids * 70 };
  if (quote) d.msgs.push({ r: 'u', t: `About “${quote}”` });
  const b = addNode(d, { pop: true }); b.el.style.zIndex = ++zTop; addLin(pid, b.id);
  if (quote) { const ai = { r: 'a', t: '' }; b.msgs.push(ai); render(b); setTimeout(() => { ai.t = `<p>Happy to dig into that line on its own. This branch carries a summary of the parent chat, so ask your side question and the main thread stays clean.</p>`; render(b); }, 700); }
  return b;
}

/* ---------- full-screen node ---------- */
const R = document.getElementById('reader'), RI = R.querySelector('.in'), scrim = document.getElementById('scrim');
const reader = { id: null, prog: new Spring(0, .46, 1), rect: null };
function nodeRect(n) { const r = n.el.querySelector('.face').getBoundingClientRect(); return { l: r.left, t: r.top, r: innerWidth - r.right, b: innerHeight - r.bottom, rad: 12 * cam.z.x }; }
function openReader(id) {
  const n = nodes.get(id); if (!n || !isChat(n)) return;
  if (reader.id && reader.id !== id) finishClose();
  select(id); reader.id = id; reader.rect = nodeRect(n);
  renderReader(n); R.style.display = 'block'; reader.prog.cfg(.46, 1).to(1);
  setTimeout(() => RI.querySelector('textarea')?.focus({ preventScroll: true }), RM ? 0 : 300);
}
function closeReader() { if (!reader.id) return; const n = nodes.get(reader.id); if (n) reader.rect = nodeRect(n); closeMenu(); reader.prog.cfg(.36, 1).to(0); }
function finishClose() { const n = nodes.get(reader.id); R.style.display = 'none'; scrim.style.opacity = 0; reader.id = null; reader.prog.snap(0); if (n) { n.el.style.opacity = ''; render(n); } }
function renderReader(c) {
  const m = MODELS[c.model], parent = c.parent && nodes.get(c.parent);

      <div class="r-crumb">${parent ? `<span class="p">${esc(parent.title)}</span><span>/</span>` : ''}<strong>${esc(c.title)}</strong></div><div class="r-sp"></div>
      <button class="mbtn" data-model style="--c:${m.c}"><span class="md"></span>${m.name}${I('chevron-down', 'var(--t3)', 14)}</button>
      <button class="mbtn" data-branch>${I('git-branch', 'var(--t2)', 15)} Branch</button></div>
    <aside class="rail"></aside>
    <section class="r-main"><div class="r-scroll"><div class="r-th"></div></div>
      <div class="r-compose"><textarea rows="1" placeholder="Ask a follow-up" aria-label="Message"></textarea><div class="cbar"><span class="meta rl"></span><button class="send" aria-label="Send" disabled>${I('arrow-up')}</button></div></div></section>`;
  renderRail(c); renderThread(c);

  RI.querySelector('[data-branch]').onclick = () => { closeReader(); setTimeout(() => { const b = branch(c.id); select(b.id); focusCompose(b); }, RM ? 0 : 300); };

  const go = () => { const v = ta.value.trim(); if (!v) return; ta.value = ''; ta.style.height = 'auto'; sb.disabled = true; send(c, v); renderRail(c); };
  ta.addEventListener('input', () => { sb.disabled = !ta.value.trim(); ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } });
  sb.onclick = go;
}
function tokensOf(n) { if (n.type === 'note') return Math.max(20, Math.round((n.text || '').length / 4)); if (n.type === 'stack') return n.members.filter(m => !m.off).length * 1400; return (n.ex || []).filter(e => e.on).length * 450 + 200; }
function renderRail(c) {
  const rail = RI.querySelector('.rail'), ins = incoming(c.id), parent = c.parent && nodes.get(c.parent);
  let total = 600 + (parent ? SUMMARY : 0);
  const rows = ins.map((e, i) => {
    const s = nodes.get(e.from), T = TYPES[s.type], [col, bg] = FAM[T.fam], failed = s.status === 'failed', on = !e.muted && !failed;
    if (on) total += tokensOf(s);
    const nm = s.type === 'note' ? (s.text || 'Note').slice(0, 42) : s.title;
    const sub = failed ? '<span style="color:var(--failed)">Failed · not sent</span>' : e.muted ? 'Muted' : `${(tokensOf(s) / 1000).toFixed(1)}k tokens`;
    return `<div class="rs ${on ? '' : 'off'}"><span class="ic" style="background:${s.type === 'note' ? '#3A3628' : bg}">${I(T.icon, s.type === 'note' ? 'var(--paper)' : col, 15)}</span><span class="tx"><b>${esc(nm)}</b><span class="meta">${sub}</span></span>${failed ? '' : `<button class="sw ${on ? 'on' : ''}" role="switch" aria-checked="${on}" aria-label="Include ${esc(nm)}" data-i="${i}"></button>`}</div>`;
  }).join('');
  rail.innerHTML = `<div><h4>THIS CHAT READS</h4>${rows || `<p style="font-size:13px;line-height:1.5;color:var(--t3);margin:0">Nothing yet. Back on the board, drag the orange port on any source onto this chat.</p>`}</div>
    ${parent ? `<div><h4>CARRIED FROM</h4><div class="inherit"><b>${esc(parent.title)}</b><br>A ${SUMMARY}-token summary of that chat, up to where you branched.</div></div>` : ''}
    <div class="budget"><div class="n">≈ ${(total / 1000).toFixed(1)}k</div><p>tokens sent with each message. One long chat holding all of this would send about ${((total + 9000) / 1000).toFixed(0)}k.</p></div>`;
  rail.querySelectorAll('.sw').forEach(b => b.onclick = () => { const e = ins[+b.dataset.i]; e.muted = !e.muted; renderRail(c); refreshPorts(); });
  const k = ins.filter(e => !e.muted && nodes.get(e.from).status !== 'failed').length;
  RI.querySelector('.rl').textContent = k ? `Reads ${k} source${k > 1 ? 's' : ''}` : parent ? 'Carries its parent' : 'Reads no sources';
}
function renderThread(c) {
  const th = RI.querySelector('.r-th'); if (!th) return;
  th.innerHTML = `<h2 class="r-title">${esc(c.title)}</h2>` + (c.msgs.length ? c.msgs.map(m => m.r === 'u' ? `<div class="rmu">${esc(m.t)}</div>` : `<div class="rma ${m.live ? 'live' : ''}">${m.t || '<p></p>'}${!m.live && m.t ? `<div class="macts"><button data-b>${I('git-branch', 'var(--t2)', 14)} Branch from here</button><button>${I('copy', 'var(--t2)', 14)} Copy</button></div>` : ''}</div>`).join('') : `<p style="color:var(--t3);font-size:15px;margin:0">${c.parent ? 'This branch starts with a summary of its parent, so you can ask a side question without repeating yourself.' : 'Start the conversation.'}</p>`);
  th.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { closeReader(); setTimeout(() => { const n = branch(c.id); select(n.id); focusCompose(n); }, RM ? 0 : 300); });
}
const menu = document.getElementById('menu');
function openModelMenu(btn, c) {
  if (menu.classList.contains('open')) return closeMenu();
  const r = btn.getBoundingClientRect();
  menu.innerHTML = Object.entries(MODELS).map(([k, m]) => `<button data-m="${k}" style="--c:${m.c}"><span class="md"></span>${m.name}${k === c.model ? `<span class="ck">${I('check', 'var(--t2)', 14)}</span>` : ''}</button>`).join('') + `<div class="mnote">Switching keeps everything this chat reads.</div>`;
  menu.style.top = (r.bottom + 6) + 'px'; menu.style.right = (innerWidth - r.right) + 'px';
  requestAnimationFrame(() => menu.classList.add('open'));
  menu.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { c.model = b.dataset.m; closeMenu(); render(c); renderReader(c); });
}
function closeMenu() { menu.classList.remove('open'); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('#menu, [data-model]')) closeMenu(); if (!e.target.closest('#selbranch')) hideSel(); });

/* ---------- dock + tooltips ---------- */
const tip = document.getElementById('tip'); let tipTimer, tipWarm = 0;
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(b => {
    b.addEventListener('pointerenter', () => {
      clearTimeout(tipTimer);
      const show = () => { tip.innerHTML = b.dataset.tip + (b.dataset.kbd ? `<kbd>${b.dataset.kbd}</kbd>` : ''); const r = b.getBoundingClientRect(); const side = !!b.closest('#dock'); tip.style.left = (side ? r.right + 10 : r.left + r.width / 2 - tip.offsetWidth / 2) + 'px'; tip.style.top = (side ? r.top + r.height / 2 - 13 : r.top - 34) + 'px'; tip.classList.toggle('instant', performance.now() - tipWarm < 500); tip.classList.add('show'); };
      performance.now() - tipWarm < 500 ? show() : (tipTimer = setTimeout(show, 450));
    });
    b.addEventListener('pointerleave', () => { clearTimeout(tipTimer); if (tip.classList.contains('show')) tipWarm = performance.now(); tip.classList.remove('show'); });
  });
}
bindTips(document.getElementById('dock'));
const NEW = {
  chat: () => ({ type: 'chat', model: 'claude', title: 'Untitled', msgs: [] }),
  note: () => ({ type: 'note', text: '', meta: 'Note · You · now' }),
  pdf: () => ({ type: 'pdf', title: 'Churn analysis Q3', meta: 'PDF · 12 pages', status: 'processing', procText: 'Reading 12 pages…', after: 1800, ex: [{ loc: 'p. 4', t: 'Churn doubles for users who never connect a source.', on: true }, { loc: 'p. 9', t: 'Annual plans churn at a third of monthly.', on: true }] }),
  web: () => ({ type: 'web', title: 'The middle plan effect', meta: 'Web · pricingpage.guide', status: 'processing', procText: 'Reading page…', after: 1500, ex: [{ loc: null, t: 'With three plans, the middle one is chosen about 60% of the time.', on: true }] }),
  video: () => ({ type: 'video', title: 'Founder Q&A: first 100 customers', meta: 'YouTube · 41:07', status: 'processing', procText: 'Extracting transcript…', fail: 1700, failText: 'Failed · no captions' }),
  podcast: () => ({ type: 'podcast', title: 'Bootstrapped pricing', meta: 'Podcast · Ep. 88 · 52:10', status: 'processing', procText: 'Transcribing…', after: 2000, ex: [{ loc: '08:15', t: 'Price per seat breaks down for solo tools.', on: true }, { loc: '40:02', t: 'Charge annually from day one.', on: true }] }),
  csv: () => ({ type: 'csv', title: 'Signups by plan', meta: 'CSV · 6 columns · 240 rows', status: 'processing', procText: 'Reading 240 rows…', after: 1400, ex: [{ loc: 'C-002', t: '71% of signups stay on the free plan after 30 days.', on: true }] }),
};
function addFromDock(kind) {
  const d = NEW[kind](); d.id = kind + (++uid);
  const [cx, cy] = s2w(innerWidth / 2, innerHeight / 2), k = nodes.size % 5;
  d.x = cx - 170 + (k - 2) * 24; d.y = cy - 100 + (k - 2) * 18;
  const n = addNode(d, { pop: true }); n.el.style.zIndex = ++zTop; select(n.id);
  if (d.after) setTimeout(() => { n.status = 'ready'; render(n); }, d.after);
  if (d.fail) setTimeout(() => { n.status = 'failed'; render(n); }, d.fail);
  if (kind === 'note') setTimeout(() => n.el.querySelector('.note-in .n')?.focus(), 30);
  if (kind === 'chat') focusCompose(n);
}
document.querySelectorAll('#dock [data-add]').forEach(b => b.addEventListener('click', () => addFromDock(b.dataset.add)));
document.querySelectorAll('#zoom [data-z]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.z; k === 'fit' ? fit(true) : zoomAt(innerWidth / 2, innerHeight / 2, cam.z.t * (k === 'in' ? 1.25 : .8), true); }));
document.addEventListener('keydown', e => {
  const typing = e.target.closest?.('input, textarea, [contenteditable="true"]');
  if (e.key === 'Escape') { if (menu.classList.contains('open')) return closeMenu(); if (reader.id) return closeReader(); if (selEdge) return closeEdgeMenu(); if (typing) return e.target.blur(); return select(null); }
  if (typing || reader.id) return;
  if (e.key === 'Enter' && selected && isChat(nodes.get(selected) || {})) { e.preventDefault(); openReader(selected); }
  if (!e.metaKey && !e.ctrlKey && e.key.toLowerCase() === 'n') { e.preventDefault(); addFromDock('note'); }
  if (!e.metaKey && !e.ctrlKey && e.key.toLowerCase() === 'c') { e.preventDefault(); addFromDock('chat'); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selEdge) { const x = selEdge; closeEdgeMenu(); dropEdge(x); }
});

/* ---------- frame loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const steps = Math.max(1, Math.ceil(dt * 240)), h = dt / steps;
  for (let i = 0; i < steps; i++) springs.forEach(s => s.step(h));
  const z = cam.z.x;
  // S pills at low zoom, with hysteresis
  const want = size === 'S' ? (z > .5 ? 'M' : 'S') : (z < .42 ? 'S' : 'M');
  if (want !== size) { size = want; nodes.forEach(render); select(selected); }
  world.style.transform = `translate3d(${cam.x.x}px,${cam.y.x}px,0) scale(${z})`;
  vp.style.backgroundSize = `${20 * z}px ${20 * z}px`; vp.style.backgroundPosition = `${cam.x.x}px ${cam.y.x}px`;
  document.getElementById('zl').textContent = Math.round(z * 100) + '%';
  nodes.forEach(n => { n.el.style.transform = `translate3d(${n.px.x}px,${n.py.x}px,0) scale(${n.s.x})`; if (reader.id === n.id) return; n.el.style.opacity = n.el.classList.contains('faded') ? '' : Math.max(0, Math.min(1, n.o.x)); });
  const focusChat = selected && isChat(nodes.get(selected) || {});
  edges.forEach(e => {
    const A = nodes.get(e.from), B = nodes.get(e.to); if (!A || !B) return;
    const g = geom(e); e.mx.to(g.m[0]); e.my.to(g.m[1]);
    const d = path(g.a, g.b, e.mx.x, e.my.x); e.p.setAttribute('d', d); e.hit.setAttribute('d', d);
    const { st, chip } = edgeState(e);
    const cls = ['e']; if (st.bundled && !st.muted && !st.broken) cls.push('bundled');
    if (st.broken) cls.push('broken'); else if (st.muted) cls.push('muted'); else if (st.pending) cls.push('pending'); else if (st.reading) cls.push('reading'); else if (st.sel) cls.push('sel'); else if (st.outdated) cls.push('outdated');
    if (focusChat && !(e.to === selected || e.from === selected)) cls.push('faded');
    const c = cls.join(' '); if (e.p.getAttribute('class') !== c) e.p.setAttribute('class', c);
    e.p.style.opacity = Math.min(A.o.x, B.o.x);
    if (chip) {
      e.chip.style.display = ''; e.chip.style.left = e.mx.x + 'px'; e.chip.style.top = e.my.x + 'px';
      const html = chip === 'x' ? I('x', 'var(--failed)', 12) : esc(chip);
      if (e.chip.dataset.v !== chip) { e.chip.innerHTML = html; e.chip.dataset.v = chip; e.chip.className = 'echip' + (chip === 'x' ? ' x' : ''); }
      e.chip.classList.toggle('faded', cls.includes('faded'));
    } else e.chip.style.display = 'none';
    if (selEdge === e && emenu) { emenu.style.left = e.mx.x + 'px'; emenu.style.top = e.my.x + 'px'; }
  });
  lins.forEach(l => {
    const A = nodes.get(l.parent), B = nodes.get(l.child); if (!A || !B) return;
    const a = portPt(A, 'r'), b = portPt(B, 'l'), k = Math.max(40, Math.abs(b[0] - a[0]) * .5);
    l.p.setAttribute('d', `M${a[0]},${a[1]} C${a[0] + k},${a[1]} ${b[0] - k},${b[1]} ${b[0]},${b[1]}`);
    const on = selected && (l.parent === selected || l.child === selected);
    l.p.setAttribute('class', 'lin' + (on ? ' sel' : '') + (focusChat && !on ? ' faded' : ''));

  }

    const p = Math.max(0, Math.min(1.02, reader.prog.x)), r = reader.rect, F = 12, L = (a, b) => a + (b - a) * p;
    R.style.clipPath = `inset(${L(r.t, F)}px ${L(r.r, F)}px ${L(r.b, F)}px ${L(r.l, F)}px round ${L(r.rad, 16)}px)`;
    const co = Math.max(0, Math.min(1, (p - .3) / .5)); RI.style.opacity = co; RI.style.transform = `translateY(${(1 - co) * 10}px)`;
    scrim.style.opacity = Math.min(1, p);

/* ---------- boot ---------- */
seed.forEach(d => addNode(d));
seedEdges.forEach(([a, b, o]) => addEdge(a, b, o || {}));
seed.filter(d => d.parent).forEach(d => addLin(d.parent, d.id));
requestAnimationFrame(() => {
  nodes.forEach(n => { n.h = n.el.offsetHeight; });
  edges.forEach(e => { const g = geom(e); e.mx.snap(g.m[0]); e.my.snap(g.m[1]); });
  fit(false, ['video', 'podcast', 'pdf', 'note', 'main', 'side', 'second']); refreshPorts(); select(null);
  requestAnimationFrame(frame);
});
addEventListener('resize', () => fit(true));
