<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context workflows: shelves, citations, desks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #141311; --node: #1C1B19; --raised: #262522; --border: #2E2D2A; --edge: #55555C; --paper: #EFE9DA;
  --t1: #E8E6E1; --t2: #A19E96; --t3: #8A877F; --t-prompt: #DCD9D2; --t-body: #C9C6BF;
  --signal: #F25A1A; --signal-2: #F2733A; --ready: #3FBF7F; --failed: #FF7A66; --muted: #3A3936;
  --media: #B38CFF; --web: #6FB3FF; --docs: #E8E6E1; --data: #3FBF7F;
  --well-media: #241D33; --well-web: #172230; --well-docs: #262522; --well-data: #16241C;
  --sh: 0 10px 30px -14px rgba(0,0,0,.7); --sh-lift: 0 2px 6px rgba(0,0,0,.35), 0 30px 60px -16px rgba(0,0,0,.85);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  font-family: Geist, system-ui, sans-serif; color: var(--t1); -webkit-font-smoothing: antialiased; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.i { width: var(--s, 16px); height: var(--s, 16px); flex: none; display: inline-block; background: var(--c, var(--t2)); -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat; }
.meta { font: 400 10px/1.2 'Geist Mono', monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font: 400 10px/1 'Geist Mono', monospace; padding: 3px 5px; border-radius: 4px; flex: none; background: var(--raised); color: var(--t-prompt); }
.chip.media { background: #2A2433; color: #C9B3FF; } .chip.data { background: #16301F; color: #7FE0AA; } .chip.web { background: #17283A; color: #A9D0FF; }
@keyframes caret { 50% { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes arrive { from { transform: scale(.7); opacity: 0; } }

#vp { position: fixed; inset: 0; background-color: var(--canvas); background-image: radial-gradient(#2A2926 1px, transparent 1.2px); touch-action: none; }
#vp.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#lines { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; z-index: 1; pointer-events: none; }
#lines path { fill: none; stroke: #45443F; stroke-width: 2; stroke-linecap: round; transition: stroke 200ms ease, opacity 200ms ease; }
#lines path.on { stroke: var(--t3); }
#lines path.flow { stroke: var(--signal); stroke-width: 2.5; }
#lines path.faded { opacity: .25; }
#lines circle { fill: var(--canvas); stroke: #45443F; stroke-width: 2; transition: stroke 200ms ease, opacity 200ms ease; }
#lines circle.flow { stroke: var(--signal); }

/* nodes */
.card { position: absolute; left: 0; top: 0; will-change: transform; z-index: 2; transition: opacity 220ms ease; user-select: none; -webkit-user-select: none; }
.card.faded { opacity: .42; }
.face { position: relative; background: var(--node); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--sh); cursor: grab; transition: box-shadow 240ms var(--ease-out), border-color 200ms ease; }
.card.lift .face { box-shadow: var(--sh-lift); cursor: grabbing; }
.card.selected .face { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal), var(--sh-lift); }
.card.lit .face { border-color: #6A3B22; }
.card.drop .face { border-color: var(--signal); box-shadow: 0 0 0 4px rgba(242,90,26,.14), var(--sh-lift); }
.m { height: 120px; padding: 12px; display: flex; gap: 12px; }
.well { width: 88px; height: 96px; flex: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.title { font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex { display: flex; gap: 6px; align-items: flex-start; }
.ex span:last-child { font-size: 12px; line-height: 1.4; color: var(--t2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pg { width: 58px; height: 78px; background: #F4F3EF; border-radius: 2px; padding: 8px 7px; display: flex; flex-direction: column; gap: 3px; }
.pg b { height: 4px; background: #2A2724; border-radius: 1px; width: 82%; margin-bottom: 2px; } .pg span { height: 2px; background: #C9C5BB; border-radius: 1px; } .pg span:nth-child(4n) { width: 66%; }
.wave { display: flex; align-items: center; gap: 2px; height: 100%; padding: 0 8px; } .wave i { width: 3px; border-radius: 2px; background: var(--media); } .wave i.past { background: #6B5A8A; } .wave i.at { background: var(--signal); }
.vframe { position: absolute; inset: 10px 8px 22px; border-radius: 5px; background: #1A1526; display: grid; place-items: center; }
.vbar { position: absolute; left: 8px; right: 8px; bottom: 12px; height: 3px; border-radius: 2px; background: #3A2F4E; } .vbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 64%; background: var(--media); border-radius: 2px; } .vbar b { position: absolute; top: -3px; left: 64%; width: 3px; height: 9px; border-radius: 1px; background: var(--signal); }
.browser { position: absolute; inset: 10px 8px; border-radius: 5px; background: #1D2B3B; padding: 6px; display: flex; flex-direction: column; gap: 4px; } .browser b { height: 4px; border-radius: 1px; background: var(--web); opacity: .85; } .browser span { height: 2px; border-radius: 1px; background: #3E5670; }
.grid { position: absolute; inset: 12px 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; align-content: start; } .grid i { height: 7px; border-radius: 1px; background: #24382C; } .grid i.h { background: var(--data); opacity: .8; }
.card.note .face { background: var(--paper); border-color: #D9D1BD; color: #2A2724; }
.card.note.selected .face { border-color: var(--signal); }
.note-in { padding: 12px 14px 14px; height: 120px; display: flex; flex-direction: column; gap: 6px; }
.note-in .meta { color: #8C836F; } .note-in .n { font-size: 14px; line-height: 1.45; }

/* chat */
.chat-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; min-height: 34px; }
.md { width: 8px; height: 8px; border-radius: 4px; background: var(--c); flex: none; }
.chat-h .title { flex: 1; }
.chat-h .meta.live { color: var(--signal-2); }
.cbody { max-height: 300px; overflow: auto; padding: 12px 14px 14px; cursor: auto; user-select: text; scrollbar-width: thin; scrollbar-color: #3A3936 transparent; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }
.cbody.short { -webkit-mask-image: none; mask-image: none; }
.mu { display: inline-block; max-width: 96%; background: var(--raised); border-radius: 10px; padding: 8px 11px; font-size: 13.5px; line-height: 1.55; color: var(--t-prompt); margin: 0 0 12px; }
.ma { font-size: 13px; line-height: 1.55; color: var(--t2); margin-bottom: 12px; }
.ma h3 { font-size: 13px; font-weight: 600; color: var(--t1); margin: 12px 0 3px; } .ma h3:first-child { margin-top: 0; }
.ma p { margin: 0 0 8px; } .ma ol { margin: 0 0 8px; padding-left: 18px; } .ma li { margin-bottom: 3px; } .ma b { color: var(--t1); font-weight: 600; }
.ma.live p:last-child::after { content: ''; display: inline-block; width: 6px; height: 13px; margin-left: 2px; vertical-align: -2px; background: var(--signal); animation: caret 900ms steps(1) infinite; }
.cempty { font-size: 13px; line-height: 1.5; color: var(--t3); }
.compose { border-top: 1px solid var(--border); padding: 10px 10px 8px 14px; display: none; cursor: auto; position: relative; }
.card.selected .compose, .card.empty .compose { display: block; }
.compose textarea { width: 100%; border: 0; outline: none; resize: none; font: inherit; font-size: 14px; line-height: 1.45; background: none; color: var(--t1); min-height: 22px; max-height: 120px; }
.compose textarea::placeholder { color: var(--t3); }
.cbar { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.send { width: 28px; height: 28px; border-radius: 14px; background: var(--signal); display: grid; place-items: center; margin-left: auto; transition: transform 120ms var(--ease-out), opacity 150ms ease; flex: none; }
.send .i { --c: #140A05; --s: 14px; } .send:active { transform: scale(.92); } .send:disabled { opacity: .25; cursor: default; }
.tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 1px; padding: 2px; border-radius: 8px; background: var(--node); box-shadow: -10px 0 12px -4px var(--node); opacity: 0; pointer-events: none; transition: opacity 140ms ease-out; z-index: 2; }
.card.selected .tools { opacity: 1; pointer-events: auto; }
@media (hover: hover) and (pointer: fine) { .card:hover .tools { opacity: 1; pointer-events: auto; } }
.tb { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; transition: background-color 150ms ease, transform 120ms var(--ease-out); }
.tb:active { transform: scale(.92); }
@media (hover: hover) and (pointer: fine) { .tb:hover { background: var(--raised); } .tb:hover .i { --c: var(--t1); } }

/* ---------- A: shelves ---------- */
.shelf { margin: 10px 10px 0; padding: 6px; border-radius: 9px; background: #171614; border: 1px dashed transparent; display: flex; flex-wrap: wrap; gap: 4px; min-height: 36px; align-items: center; transition: border-color 160ms ease, background-color 160ms ease; cursor: auto; }
.card.drop .shelf { border-color: var(--signal); background: #22170F; }
.shelf .lbl { font: 400 10px 'Geist Mono', monospace; letter-spacing: .04em; color: var(--t3); padding: 0 4px; text-transform: uppercase; }
.shelf .hint { font-size: 12px; color: var(--t3); padding: 0 4px; }
.sch { height: 24px; padding: 0 8px 0 6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; background: var(--raised); color: var(--t1); transition: background-color 150ms ease, opacity 200ms ease, box-shadow 150ms ease, transform 120ms var(--ease-out); }
.sch .i { --s: 13px; }
.sch:active { transform: scale(.96); }
.sch.arrive { animation: arrive 320ms var(--ease-out); }
.sch.inh { background: transparent; box-shadow: inset 0 0 0 1px #3A3936; color: var(--t2); }
.sch.inh .up { font: 400 10px 'Geist Mono', monospace; color: var(--t3); }
.sch.off { opacity: .4; text-decoration: line-through; }
.sch .x { width: 14px; height: 14px; display: none; place-items: center; border-radius: 4px; margin-right: -3px; }
.sch .x .i { --s: 11px; }
@media (hover: hover) and (pointer: fine) { .sch.own:hover .x { display: grid; } .sch:hover { box-shadow: inset 0 0 0 1px var(--signal); } }
.loose-tag { position: absolute; left: 2px; bottom: calc(100% + 8px); font: 400 10px 'Geist Mono', monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--t3); }

/* ---------- B: citations ---------- */
#drawer { position: fixed; left: 0; top: 0; bottom: 0; width: 320px; background: #181715; border-right: 1px solid var(--border); z-index: 15; display: flex; flex-direction: column; padding-top: 68px; }
#drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 10px; }
#drawer .dh b { font: 400 10px 'Geist Mono', monospace; letter-spacing: .06em; color: var(--t3); font-weight: 400; }
#drawer .list { flex: 1; overflow: auto; padding: 0 10px 20px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: #3A3936 transparent; }
.dsrc { border: 1px solid var(--border); border-radius: 10px; background: var(--node); padding: 10px; display: flex; flex-direction: column; gap: 8px; transition: border-color 160ms ease, box-shadow 160ms ease; }
.dsrc.hot { border-color: var(--signal); box-shadow: 0 0 0 3px rgba(242,90,26,.14); }
.dsrc .top { display: flex; gap: 10px; align-items: center; }
.dsrc .w { width: 34px; height: 40px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.dsrc .key { font: 400 11px 'Geist Mono', monospace; color: var(--signal-2); }
.dex { display: flex; gap: 8px; align-items: flex-start; text-align: left; padding: 5px 6px; margin: 0 -4px; border-radius: 6px; font-size: 12px; line-height: 1.4; color: var(--t-body); transition: background-color 150ms ease, box-shadow 150ms ease; }
.dex.hot { box-shadow: inset 0 0 0 1px var(--signal); background: #22170F; }
@media (hover: hover) and (pointer: fine) { .dex:hover { background: var(--raised); } }
.cite { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; margin: 0 1px; border-radius: 5px; background: #2A1C14; color: #FFB48C; font: 500 11px/1 'Geist Mono', monospace; vertical-align: 1px; cursor: help; transition: background-color 150ms ease; white-space: nowrap; }
.cite .i { --s: 11px; --c: #FFB48C; }
.cite:hover, .cite.hot { background: #3D2414; }
#overlay { position: fixed; inset: 0; pointer-events: none; z-index: 16; }
#overlay path { fill: none; stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 4 4; }
#overlay circle { fill: var(--signal); }
.picker { position: fixed; z-index: 70; width: 340px; max-height: 280px; overflow: auto; padding: 4px; border-radius: 10px; background: var(--node); border: 1px solid var(--border); box-shadow: var(--sh-lift); display: none; }
.picker.open { display: block; }
.picker .ph { font: 400 10px 'Geist Mono', monospace; letter-spacing: .04em; color: var(--t3); padding: 6px 8px 4px; text-transform: uppercase; }
.picker button { width: 100%; display: flex; gap: 8px; align-items: flex-start; text-align: left; padding: 6px 8px; border-radius: 7px; font-size: 12px; line-height: 1.4; color: var(--t-body); }
.picker button.act { background: var(--raised); color: var(--t1); }
.picker button .k { font: 400 11px 'Geist Mono', monospace; color: var(--signal-2); flex: none; min-width: 92px; }

/* ---------- C: desks ---------- */
.desk { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 22px; background: rgba(255, 250, 240, .025); border: 1px solid #2A2926; transition: border-color 180ms ease, background-color 180ms ease, opacity 200ms ease; pointer-events: none; }
.desk.hot { border-color: var(--signal); background: rgba(242, 90, 26, .05); }
.desk.faded { opacity: .35; }
.desk .tab { position: absolute; left: 18px; top: -11px; height: 22px; padding: 0 10px; border-radius: 11px; background: var(--canvas); border: 1px solid #2A2926; display: inline-flex; align-items: center; gap: 8px; font: 400 10px 'Geist Mono', monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--t3); white-space: nowrap; transition: border-color 180ms ease, color 180ms ease; }
.desk.hot .tab { border-color: var(--signal); color: var(--signal-2); }
.desk .tab b { color: var(--t2); font-weight: 400; }

/* chrome */
.bar { background: rgba(28,27,25,.8); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--border); box-shadow: 0 12px 32px -12px rgba(0,0,0,.7); }
#seg { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#seg .btns { display: flex; padding: 4px; border-radius: 12px; gap: 2px; }
#seg button { height: 32px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--t2); display: inline-flex; align-items: center; gap: 8px; transition: background-color 150ms ease, color 150ms ease, transform 120ms var(--ease-out); }
#seg button b { font: 500 11px 'Geist Mono', monospace; color: var(--t3); }
#seg button.on { background: var(--raised); color: var(--t1); } #seg button.on b { color: var(--signal-2); }
#seg button:active { transform: scale(.96); }
#seg .sub { font-size: 12.5px; color: var(--t2); background: rgba(20,19,17,.85); padding: 5px 10px; border-radius: 8px; max-width: 640px; text-align: center; line-height: 1.45; }
#rail { position: fixed; left: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; padding: 5px; border-radius: 14px; z-index: 20; }
#rail button { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; transition: background-color 150ms ease, transform 120ms var(--ease-out); }
#rail button .i { --s: 18px; } #rail button:active { transform: scale(.92); }
@media (hover: hover) and (pointer: fine) { #rail button:hover { background: var(--raised); } }
#zoom { position: fixed; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; z-index: 20; }
#zoom button { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; transition: background-color 150ms ease; }
#zoom .z { width: 46px; font: 500 12px 'Geist Mono', monospace; color: var(--t2); text-align: center; }
@media (hover: hover) and (pointer: fine) { #zoom button:hover { background: var(--raised); } }
#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; font-size: 12.5px; color: var(--t3); z-index: 20; line-height: 1.6; max-width: 560px; text-align: center; background: rgba(20,19,17,.85); padding: 6px 12px; border-radius: 8px; }
body.mode-b #hint { left: calc(50% + 160px); }
#hint b { color: var(--t2); font-weight: 600; }
.tip { position: fixed; z-index: 100; pointer-events: none; background: var(--t1); color: var(--canvas); font-size: 12px; font-weight: 500; padding: 5px 8px; border-radius: 7px; white-space: nowrap; opacity: 0; transition: opacity 125ms ease-out; }
.tip.show { opacity: 1; }

/* full-screen node */
#scrim { position: fixed; inset: 0; background: rgba(5,5,4,.55); opacity: 0; pointer-events: none; z-index: 40; }
#reader { position: fixed; inset: 0; z-index: 50; display: none; background: var(--node); }
#reader .in { position: absolute; inset: 12px; display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 56px 1fr; }
.r-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; border-bottom: 1px solid var(--border); }
.pb { height: 30px; padding: 0 11px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--t2); display: inline-flex; align-items: center; gap: 6px; transition: background-color 150ms ease, color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .pb:hover { background: var(--raised); color: var(--t1); } }
.r-top kbd { font: 500 10px 'Geist Mono', monospace; color: var(--t3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.r-crumb { font-size: 13px; color: var(--t3); display: flex; gap: 8px; min-width: 0; } .r-crumb strong { color: var(--t1); font-weight: 600; }
.rail { border-right: 1px solid var(--border); padding: 20px 16px; overflow: auto; display: flex; flex-direction: column; gap: 20px; }
.rail h4 { margin: 0 0 10px; font: 400 10px 'Geist Mono', monospace; letter-spacing: .04em; color: var(--t3); }
.rs { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 6px; }
.rs.off { opacity: .45; }
.rs .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.rs .tx { flex: 1; min-width: 0; } .rs .tx b { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.budget { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
.budget .n { font: 500 22px 'Geist Mono', monospace; letter-spacing: -0.03em; } .budget p { margin: 4px 0 0; font-size: 12px; line-height: 1.45; color: var(--t3); }
.r-main { display: flex; flex-direction: column; min-height: 0; }
.r-scroll { flex: 1; overflow: auto; padding: 40px 24px 24px; }
.r-th { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.r-title { font-size: 28px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 4px; }
.rmu { align-self: flex-end; max-width: 82%; background: var(--raised); border-radius: 12px; padding: 10px 14px; font-size: 15px; line-height: 1.6; color: var(--t-prompt); }
.rma { font-size: 16px; line-height: 1.7; color: var(--t-body); }
.rma h3 { font-size: 16px; font-weight: 600; color: var(--t1); margin: 18px 0 2px; } .rma h3:first-child { margin-top: 0; }
.rma p { margin: 0 0 12px; } .rma ol { margin: 0 0 12px; padding-left: 22px; } .rma b { color: var(--t1); }
.rma.live p:last-child::after { content: ''; display: inline-block; width: 7px; height: 16px; margin-left: 2px; vertical-align: -3px; background: var(--signal); animation: caret 900ms steps(1) infinite; }
.r-compose { max-width: 720px; width: calc(100% - 48px); margin: 0 auto 20px; border-radius: 14px; background: var(--canvas); border: 1px solid var(--border); padding: 12px 12px 10px 14px; position: relative; }
.r-compose textarea { width: 100%; border: 0; outline: none; resize: none; font: inherit; font-size: 15px; line-height: 1.5; min-height: 24px; max-height: 160px; color: var(--t1); background: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<div id="vp"><div id="world"><svg id="lines"></svg></div></div>
<div id="seg"><div class="btns bar">
  <button data-mode="a"><b>A</b>Shelves</button><button data-mode="b"><b>B</b>Citations</button><button data-mode="c"><b>C</b>Desks</button>
</div><div class="sub" id="sub"></div></div>

/* ======================= frame ======================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const steps = Math.max(1, Math.ceil(dt * 240)), h = dt / steps;
  for (let i = 0; i < steps; i++) springs.forEach(s => s.step(h));
  const z = cam.z.x;
  world.style.transform = `translate3d(${cam.x.x}px,${cam.y.x}px,0) scale(${z})`;
  vp.style.backgroundSize = `${20 * z}px ${20 * z}px`; vp.style.backgroundPosition = `${cam.x.x}px ${cam.y.x}px`;
  document.getElementById('zl').textContent = Math.round(z * 100) + '%';
  nodes.forEach(n => { n.el.style.transform = `translate3d(${n.px.x}px,${n.py.x}px,0) scale(${n.s.x})`; if (reader.id === n.id) return; n.el.style.opacity = n.el.classList.contains('faded') ? '' : Math.max(0, Math.min(1, n.o.x)); });
  // branch lines; in A, hovering a shelf chip lights the path it flows down
  const flowPath = new Set();
  if (flowOn && flowOn.owner !== flowOn.at) { let c = nodes.get(flowOn.at); while (c && c.id !== flowOn.owner && c.parent) { flowPath.add(c.parent + '>' + c.id); c = nodes.get(c.parent); } }
  const selC = selected && nodes.get(selected) && isChat(nodes.get(selected)) ? selected : null;
  lins.forEach(l => {
    const A = nodes.get(l.parent), B = nodes.get(l.child); if (!A || !B) return;
    const a = [A.px.x + A.w, A.py.x + 22], b = [B.px.x, B.py.x + 22], k = Math.max(40, Math.abs(b[0] - a[0]) * .5);
    l.p.setAttribute('d', `M${a[0]},${a[1]} C${a[0] + k},${a[1]} ${b[0] - k},${b[1]} ${b[0]},${b[1]}`);
    l.k1.setAttribute('cx', a[0]); l.k1.setAttribute('cy', a[1]); l.k2.setAttribute('cx', b[0]); l.k2.setAttribute('cy', b[1]);
    const flow = flowPath.has(l.parent + '>' + l.child), on = selC && (l.parent === selC || l.child === selC || ancestors(selC).some(x => x.id === l.child));
    l.p.setAttribute('class', flow ? 'flow' : on ? 'on' : selC ? 'faded' : '');
    [l.k1, l.k2].forEach(k => k.setAttribute('class', flow ? 'flow' : ''));
    l.p.style.opacity = Math.min(1, B.o.x);
  });
  if (MODE === 'c') desks.forEach(d => {
    const c = nodes.get(d.chat); if (!c) return; const dragged = [...nodes.values()].find(n => n.dragging && !isChat(n));
    const b = deskBounds(d, dragged && dragged.desk === d.chat ? dragged : null); if (!b) return;
    if (!d.init) { d.x0.snap(b[0]); d.y0.snap(b[1]); d.x1.snap(b[2]); d.y1.snap(b[3]); d.init = true; } else { d.x0.to(b[0]); d.y0.to(b[1]); d.x1.to(b[2]); d.y1.to(b[3]); }
    d.el.style.transform = `translate3d(${d.x0.x}px,${d.y0.x}px,0)`; d.el.style.width = (d.x1.x - d.x0.x) + 'px'; d.el.style.height = (d.y1.x - d.y0.x) + 'px';
    const n = deskMembers(d.chat).length, tab = d.el.querySelector('.tab'), txt = `Desk · <b>${esc(c.title)}</b> · ${n} on desk${c.parent ? ' + parent desk' : ''}`;
    if (tab.dataset.v !== txt) { tab.innerHTML = txt; tab.dataset.v = txt; }
  });
  if (reader.id) {
    const p = Math.max(0, Math.min(1.02, reader.prog.x)), r = reader.rect, F = 12, L = (a, b) => a + (b - a) * p;
    R.style.clipPath = `inset(${L(r.t, F)}px ${L(r.r, F)}px ${L(r.b, F)}px ${L(r.l, F)}px round ${L(r.rad, 16)}px)`;
    const co = Math.max(0, Math.min(1, (p - .3) / .5)); RI.style.opacity = co; RI.style.transform = `translateY(${(1 - co) * 10}px)`;
    scrim.style.opacity = Math.min(1, p); const n = nodes.get(reader.id); if (n) n.el.style.opacity = Math.max(0, 1 - p / .25);
    if (reader.prog.t === 0 && reader.prog.x < .004 && Math.abs(reader.prog.v) < .05) finishClose();
  }
  requestAnimationFrame(frame);
}
