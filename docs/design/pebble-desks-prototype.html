<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Tree · Pebble desks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Pebble — soft colour-coded objects, thick tubes
   ========================================================= */
:root {
  --bg: #EFE9F7; --ink: #2B2340; --ink-2: #6E6585; --ink-3: #9A91B0; --lilac: #D8CFEA; --tube: #CFC6E6; --trail: #8F7FC0;
  --white: #FFFFFF; --bubble: #F3EEFA; --flow: #E2B52A; --flow-2: #C79A10; --snap: #FF6B8A; --snap-bg: #FFE1E8; --amber: #E8A93A;
  --media: #FFD9C7; --media-ink: #E0673A; --docs: #FFF0B3; --docs-ink: #C79A10; --web: #C9ECFF; --web-ink: #2A86C4;
  --data: #D4F2C9; --data-ink: #3F9A2E; --note: #FFE4EF; --note-ink: #D1467E; --stack: #E6DBFF; --stack-ink: #7A52D6;
  --sh: 0 12px 30px -14px rgba(43,35,64,.33); --sh-lift: 0 30px 56px -18px rgba(43,35,64,.48);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--ink); -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--trail); outline-offset: 3px; }
.i { width: var(--s, 16px); height: var(--s, 16px); flex: none; display: inline-block; background: var(--c, currentColor); -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat; }
@keyframes caret { 50% { opacity: 0; } }
@keyframes bubbles { to { stroke-dashoffset: -28; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shim { to { background-position: -200% 0; } }

#vp { position: fixed; inset: 0; touch-action: none; }
#vp.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#tubes { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; z-index: 1; pointer-events: none; }
#tubes .tube { fill: none; stroke: var(--tube); stroke-width: 7; stroke-linecap: round; transition: stroke 220ms ease, opacity 220ms ease; }
#tubes .tube.trail { stroke: var(--trail); }
#tubes .tube.flow { stroke: var(--flow); }
#tubes .tube.faded { opacity: .35; }
#tubes .bub { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: .1 14; opacity: 0; transition: opacity 200ms ease; }
#tubes .bub.flow { opacity: 1; animation: bubbles .7s linear infinite; }
#tubes .knob { fill: #fff; stroke: var(--tube); stroke-width: 5; transition: stroke 220ms ease; }
#tubes .knob.trail { stroke: var(--trail); } #tubes .knob.flow { stroke: var(--flow); fill: var(--ink); }

/* ---------- desks: soft blobs ---------- */
.desk { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 44px; background: rgba(255,255,255,.42); pointer-events: none; transition: background-color 200ms ease, box-shadow 200ms ease, opacity 220ms ease; }
.desk.hot { background: rgba(255,255,255,.7); box-shadow: 0 0 0 4px var(--flow); }
.desk.faded { opacity: .4; }
.desk .tab { position: absolute; left: 22px; top: -15px; height: 30px; padding: 0 12px 0 6px; border-radius: 15px; background: #fff; box-shadow: 0 6px 16px -8px rgba(43,35,64,.35); display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.desk .tab .q { height: 20px; padding: 0 7px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
.desk .tab .dots { display: inline-flex; }
.desk .tab .dots i { width: 12px; height: 12px; border-radius: 6px; border: 2px solid #fff; margin-left: -5px; }
.desk .tab .dots i:first-child { margin-left: 0; }
.desk .tab .up { color: var(--ink-2); font-weight: 500; }
.desk.hot .tab { box-shadow: 0 0 0 3px var(--flow); }

/* ---------- nodes ---------- */
.card { position: absolute; left: 0; top: 0; will-change: transform; z-index: 2; user-select: none; -webkit-user-select: none; transition: opacity 220ms ease; transform-origin: 50% 40%; }
.card.faded { opacity: .4; }
.face { position: relative; border-radius: 28px; box-shadow: var(--sh); cursor: grab; transition: box-shadow 240ms var(--ease-out); }
.card.lift .face { box-shadow: var(--sh-lift); cursor: grabbing; }
.card.selected .face { box-shadow: 0 0 0 3px var(--ink), var(--sh-lift); }
.card.reading .face { box-shadow: 0 0 0 4px var(--flow), var(--sh); }
.card.drop .face { box-shadow: 0 0 0 4px var(--stack-ink), var(--sh-lift); }
.sheet { position: absolute; inset: 0; border-radius: 28px; }
.sheet.a { transform: rotate(-5deg) translate(4px, 6px); filter: brightness(.94); }
.sheet.b { transform: rotate(3.5deg) translate(-2px, 3px); filter: brightness(.97); }

/* family colours */
.f-media { --fc: var(--media); --fi: var(--media-ink); } .f-docs { --fc: var(--docs); --fi: var(--docs-ink); } .f-web { --fc: var(--web); --fi: var(--web-ink); }
.f-data { --fc: var(--data); --fi: var(--data-ink); } .f-note { --fc: var(--note); --fi: var(--note-ink); } .f-stack { --fc: var(--stack); --fi: var(--stack-ink); }
.src .face, .src .sheet { background: var(--fc); }
.src.failed .face { background: var(--snap-bg); --fi: var(--snap); }

/* M: pebble with a miniature */
.m { display: flex; gap: 14px; align-items: center; padding: 14px 18px 14px 14px; min-height: 104px; }
.well { width: 64px; height: 64px; flex: none; border-radius: 22px; background: #fff; position: relative; display: grid; place-items: center; }
.txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.meta { font-size: 12px; font-weight: 600; color: var(--fi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl { font-size: 16px; font-weight: 600; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ex { display: flex; gap: 6px; align-items: baseline; font-size: 13px; line-height: 1.35; color: color-mix(in srgb, var(--ink) 72%, var(--fi)); }
.ex span:last-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.loc { flex: none; height: 19px; padding: 0 7px; border-radius: 10px; background: #fff; color: var(--fi); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
.retry { height: 24px; padding: 0 10px; border-radius: 12px; background: var(--snap); color: #fff; font-size: 12px; font-weight: 700; }
.badge { position: absolute; right: -5px; top: -5px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; z-index: 2; }
.shimmer { background: linear-gradient(90deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,.8) 50%, rgba(255,255,255,.35) 100%); background-size: 200% 100%; animation: shim 1.2s linear infinite; border-radius: 8px; height: 12px; }

/* miniatures */
.mv { width: 44px; height: 32px; border-radius: 9px; background: var(--fc); display: grid; place-items: center; position: relative; }
.mv::after { content: ''; position: absolute; left: 5px; right: 5px; bottom: 4px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--fi) 62%, rgba(255,255,255,.7) 62%); }
.wave { display: flex; gap: 2px; align-items: center; height: 36px; }
.wave i { width: 3px; border-radius: 2px; background: var(--fc); } .wave i.on { background: var(--fi); }
.pg { width: 34px; height: 44px; border-radius: 4px; background: var(--fc); padding: 6px 5px; display: flex; flex-direction: column; gap: 3px; }
.pg b { height: 4px; border-radius: 2px; background: var(--fi); width: 80%; } .pg span { height: 2px; border-radius: 1px; background: color-mix(in srgb, var(--fi) 45%, transparent); }
.br { width: 46px; height: 36px; border-radius: 8px; background: var(--fc); padding: 5px; display: flex; flex-direction: column; gap: 3px; }
.br .d { display: flex; gap: 2px; } .br .d i { width: 4px; height: 4px; border-radius: 2px; background: var(--fi); opacity: .6; }
.br b { height: 3px; border-radius: 2px; background: var(--fi); } .br span { height: 2px; border-radius: 1px; background: color-mix(in srgb, var(--fi) 40%, transparent); }
.gr { display: grid; grid-template-columns: repeat(4, 8px); gap: 2px; }
.gr i { height: 6px; border-radius: 2px; background: var(--fc); } .gr i.h { background: var(--fi); }
.fan { position: relative; width: 44px; height: 40px; }
.fan i { position: absolute; left: 10px; top: 2px; width: 24px; height: 34px; border-radius: 4px; background: var(--fc); box-shadow: 0 0 0 2px #fff; }
.fan i:nth-child(1) { transform: rotate(-14deg) translateX(-7px); } .fan i:nth-child(3) { transform: rotate(14deg) translateX(7px); }
.nt { font-size: 26px; font-weight: 800; color: var(--fi); line-height: 1; }

/* note: text-first pebble */
.note-in { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 6px; }
.note-in .n { font-size: 16px; line-height: 1.4; font-weight: 500; outline: none; cursor: text; user-select: text; -webkit-user-select: text; min-height: 44px; }
.note-in .n:empty::before { content: 'Write a note…'; color: var(--ink-3); }

/* L: opened in place */
.l { padding: 14px 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.l .top { display: flex; gap: 14px; align-items: center; }
.exl { display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,.55); border-radius: 18px; padding: 6px; }
.exl button { display: flex; gap: 8px; align-items: baseline; text-align: left; padding: 6px 8px; border-radius: 12px; font-size: 13px; line-height: 1.35; transition: background-color 150ms ease, opacity 200ms ease; }
.exl button.off { opacity: .45; } .exl button.off span:last-child { text-decoration: line-through; }
@media (hover: hover) and (pointer: fine) { .exl button:hover { background: #fff; } }
.lfoot { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.lfoot .pill { height: 24px; padding: 0 10px; border-radius: 12px; background: #fff; display: inline-flex; align-items: center; }
.lfoot button { margin-left: auto; color: var(--ink-2); }

/* S: pill at low zoom */
.s { height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 6px; }
.s .dot { width: 40px; height: 40px; border-radius: 20px; background: #fff; display: grid; place-items: center; flex: none; }
.s .t { flex: 1; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.size-s .face { border-radius: 26px; } .card.size-s .sheet { border-radius: 26px; }

/* tools (inside node, on hover) */
.tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; opacity: 0; transform: scale(.94); transition: opacity 140ms ease-out, transform 160ms var(--ease-out); z-index: 3; }
.card.selected .tools { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) { .card:hover .tools { opacity: 1; transform: none; } }
.tb { height: 28px; min-width: 28px; padding: 0 10px; border-radius: 14px; background: #fff; box-shadow: 0 4px 10px -4px rgba(43,35,64,.3); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: transform 120ms var(--ease-out), background-color 150ms ease; }
.tb.ic { padding: 0; }
.tools.inline { position: static; margin-left: auto; }
.tb:active { transform: scale(.92); }
@media (hover: hover) and (pointer: fine) { .tb:hover { background: var(--bubble); } }

/* chat pebble */
.chat .face { background: #fff; }
.chd { display: flex; align-items: center; gap: 8px; padding: 16px 20px 0; min-height: 44px; }
.chd .md { width: 12px; height: 12px; border-radius: 6px; background: var(--c); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.chd .q { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.chd .live { font-size: 12px; font-weight: 700; color: var(--flow-2); }
.chat .ttl { padding: 6px 20px 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; -webkit-line-clamp: 3; }
.cbody { max-height: 300px; overflow: auto; padding: 12px 20px 8px; cursor: auto; user-select: text; -webkit-user-select: text; scrollbar-width: thin; scrollbar-color: var(--lilac) transparent; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }
.cbody.short { -webkit-mask-image: none; mask-image: none; }
.mu { display: inline-block; max-width: 96%; background: var(--bubble); border-radius: 18px; padding: 9px 13px; font-size: 14px; line-height: 1.45; font-weight: 500; margin: 0 0 10px; }
.ma { font-size: 14px; line-height: 1.55; color: var(--ink-2); margin-bottom: 10px; }
.ma b, .ma h3 { color: var(--ink); } .ma h3 { font-size: 14px; font-weight: 700; margin: 10px 0 2px; } .ma h3:first-child { margin-top: 0; }
.ma p { margin: 0 0 7px; } .ma ol { margin: 0 0 7px; padding-left: 18px; }
.ma.live p:last-child::after { content: ''; display: inline-block; width: 8px; height: 15px; margin-left: 2px; vertical-align: -2px; border-radius: 3px; background: var(--flow); animation: caret 900ms steps(1) infinite; }
.ma .changed { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--docs); color: var(--docs-ink); font-size: 12px; font-weight: 700; }
.cfoot { display: flex; align-items: center; gap: 8px; padding: 6px 16px 14px 20px; font-size: 13px; color: var(--ink-2); }
.cfoot .dots { display: inline-flex; }
.cfoot .dots i { width: 14px; height: 14px; border-radius: 7px; border: 2px solid #fff; margin-left: -6px; } .cfoot .dots i:first-child { margin-left: 0; }
.cfoot .warn { height: 24px; padding: 0 10px; border-radius: 12px; background: #FFF0D6; color: #A86A0B; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; }
.cfoot .sp { flex: 1; }
.send { width: 40px; height: 40px; border-radius: 20px; background: var(--ink); display: grid; place-items: center; flex: none; transition: transform 120ms var(--ease-out), opacity 150ms ease; }
.send .i { --c: #fff; --s: 18px; } .send:active { transform: scale(.92); } .send:disabled { opacity: .25; cursor: default; }
.compose { display: none; margin: 0 10px 10px; padding: 8px 8px 8px 16px; border-radius: 22px; background: var(--bubble); align-items: flex-end; gap: 8px; cursor: auto; }
.card.selected .compose, .card.empty .compose { display: flex; }
.compose textarea { flex: 1; border: 0; outline: none; resize: none; background: none; color: var(--ink); font: 500 14px/1.45 'Bricolage Grotesque'; min-height: 22px; max-height: 110px; padding: 9px 0; }
.compose textarea::placeholder { color: var(--ink-3); }

/* ---------- chrome ---------- */
.chrome { background: #fff; border-radius: 18px; box-shadow: 0 10px 30px -12px rgba(43,35,64,.35); }
#top { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; z-index: 20; pointer-events: none; }
#top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 8px; }
.brand .lg { width: 32px; height: 32px; border-radius: 16px; background: var(--ink); display: grid; place-items: center; }
.brand b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; } .brand span { font-size: 13px; color: var(--ink-2); font-weight: 500; }
#rail { position: fixed; left: 14px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 6px; padding: 8px; }
#rail button { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; transition: transform 160ms var(--ease-out); }
#rail button:active { transform: scale(.9); }
@media (hover: hover) and (pointer: fine) { #rail button:hover { transform: scale(1.08); } }
#rail .sep { height: 2px; border-radius: 1px; background: var(--bubble); margin: 2px 8px; }
#trail { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 4px; padding: 6px; max-width: calc(100vw - 280px); overflow: hidden; }
#trail .lb { font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 0 6px 0 10px; }
#trail button { height: 34px; padding: 0 12px 0 6px; border-radius: 17px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; transition: background-color 150ms ease; }
#trail button .q { height: 22px; padding: 0 7px; border-radius: 11px; background: var(--bubble); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
#trail button.here { background: var(--ink); color: #fff; } #trail button.here .q { background: rgba(255,255,255,.18); }
#trail .sep { color: var(--ink-3); font-weight: 700; }
#trail .hint { font-size: 14px; color: var(--ink-2); padding: 0 10px 0 4px; white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { #trail button:not(.here):hover { background: var(--bubble); } }
#zoom { position: fixed; right: 14px; bottom: 16px; z-index: 20; display: flex; align-items: center; padding: 4px; gap: 2px; }
#zoom button { width: 36px; height: 36px; border-radius: 18px; font-size: 18px; font-weight: 600; transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { #zoom button:hover { background: var(--bubble); } }
#zoom .z { width: 48px; text-align: center; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tip { position: fixed; z-index: 100; pointer-events: none; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; white-space: nowrap; opacity: 0; transform: translateX(-4px); transition: opacity 120ms ease-out, transform 140ms var(--ease-out); }
.tip.show { opacity: 1; transform: none; }

/* ---------- full-screen ---------- */
#scrim { position: fixed; inset: 0; background: rgba(43,35,64,.3); opacity: 0; pointer-events: none; z-index: 40; }
#reader { position: fixed; inset: 0; z-index: 50; display: none; background: #fff; }
#reader .in { position: absolute; inset: 12px; display: grid; grid-template-columns: 310px 1fr; grid-template-rows: 64px 1fr; }
.r-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px; }
.r-top strong { font-size: 18px; font-weight: 700; }
.rail { margin: 0 0 12px 12px; padding: 18px 14px; overflow: auto; display: flex; flex-direction: column; gap: 18px; background: var(--bubble); border-radius: 28px; }
.rail h4 { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.rrow { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 14px; font-size: 14px; font-weight: 500; line-height: 1.25; }
.rrow .k { height: 22px; min-width: 34px; padding: 0 7px; border-radius: 11px; background: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.rrow .c { width: 14px; height: 14px; border-radius: 7px; flex: none; }
.rrow.here { background: #fff; font-weight: 700; }
.rrow button { text-align: left; }
.budget { margin-top: auto; padding: 12px; border-radius: 20px; background: #fff; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.budget b { display: block; font-size: 26px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
.r-main { display: flex; flex-direction: column; min-height: 0; }
.r-scroll { flex: 1; overflow: auto; padding: 28px 24px; }
.r-th { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.r-th h2 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.r-th .mu { align-self: flex-end; font-size: 16px; }
.r-th .ma { font-size: 17px; line-height: 1.65; }
.r-compose { max-width: 720px; width: calc(100% - 48px); margin: 0 auto 18px; display: flex; gap: 8px; align-items: flex-end; padding: 8px 8px 8px 18px; border-radius: 26px; background: var(--bubble); }
.r-compose textarea { flex: 1; border: 0; outline: none; resize: none; background: none; color: var(--ink); font: 500 16px/1.5 'Bricolage Grotesque'; min-height: 24px; padding: 8px 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<div id="vp"><div id="world"><svg id="tubes"></svg></div></div>
<div id="top"><div class="brand chrome"><span class="lg"><span class="i" data-i="git-fork" style="--c:#fff;--s:17px"></span></span><b>Context Tree</b><span>Pricing study</span></div></div>
<div id="rail" class="chrome"></div>
<div id="trail" class="chrome"></div>
<div id="zoom" class="chrome"><button data-z="out" aria-label="Zoom out">−</button><span class="z" id="zl">100%</span><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit" aria-label="Fit board">⤢</button></div>
<div id="scrim"></div>
<div id="reader" role="dialog" aria-modal="true"><div class="in"></div></div>
<div class="tip" id="tip"></div>

<script>
/* ---------- helpers ---------- */
const LU = n => `url(https://unpkg.com/lucide-static@0.460.0/icons/${n}.svg)`;
const I = (n, c, s) => `<span class="i" style="--u:${LU(n)};${c ? `--c:${c};` : ''}${s ? `--s:${s}px;` : ''}"></span>`;
