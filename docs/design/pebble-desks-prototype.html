<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Tree · Pebble board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Pebble design system tokens
   ========================================================= */
:root {
  --pb-canvas: #EDE8F5; --pb-desk: #F5F2FA; --pb-card: #FFFFFF; --pb-lilac: #EFE9F8; --pb-edge: #CFC3E8; --pb-edge-strong: #A594D1; --pb-ink: #2B2340;
  --t1: #2B2340; --t2: #6E6585; --t3: #9A92AD;
  --ready: #3FAE5A; --stale: #E2A72A; --failed: #E5486B; --failed-ring: #FFC2CF; --failed-tile: #FFE1EA;
  --sh-node: 0 10px 24px -12px rgba(43,35,64,.28); --sh-card: 0 18px 40px -18px rgba(43,35,64,.32); --sh-float: 0 8px 24px -10px rgba(43,35,64,.22);
  --sh-lift: 0 26px 50px -18px rgba(43,35,64,.42);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--t1); -webkit-font-smoothing: antialiased;
}
/* families: fill · deep (meta, icon) · chip · excerpt text */
.f-media { --fc: #FFD9C7; --fd: #E0673A; --fk: #FF9566; --fkt: #FFFFFF; --fx: #7A4A38; }
.f-docs  { --fc: #FFF0B3; --fd: #B8860B; --fk: #F5C93A; --fkt: #5A4300; --fx: #6B5A1E; }
.f-note  { --fc: #FFE1EA; --fd: #D1467E; --fk: #F59AB8; --fkt: #FFFFFF; --fx: #7A2E4E; }
.f-web   { --fc: #C9ECFF; --fd: #2A86C4; --fk: #8FD0F5; --fkt: #14466A; --fx: #2A5A7A; }
.f-data  { --fc: #D4F2C9; --fd: #3F9A2E; --fk: #5CC24A; --fkt: #FFFFFF; --fx: #3C6A30; }
.f-image { --fc: #E6DBFF; --fd: #7A52D6; --fk: #B9A0F5; --fkt: #FFFFFF; --fx: #4F3A8A; }
.f-place { --fc: #C8F0EA; --fd: #1F9483; --fk: #74D6C8; --fkt: #FFFFFF; --fx: #1E5A52; }
.f-mixed { --fc: #EFE9F8; --fd: #6E6585; --fk: #CFC3E8; --fkt: #2B2340; --fx: #6E6585; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pb-canvas); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pb-edge-strong); outline-offset: 3px; }
.i { width: var(--s, 16px); height: var(--s, 16px); flex: none; display: inline-block; background: var(--c, currentColor); -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat; }
@keyframes caret { 50% { opacity: 0; } }
@keyframes bubbles { to { stroke-dashoffset: -28; } }
@keyframes pbshimmer { to { background-position: -200% 0; } }
@keyframes grow { from { width: 8%; } to { width: 88%; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(165,148,209,.35); } }
@keyframes think { 50% { opacity: .35; transform: scale(.8); } }

#vp { position: fixed; inset: 0; touch-action: none; }
#vp.panning { cursor: grabbing; }
body.picking #vp, body.picking .card { cursor: copy; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#tubes { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; z-index: 1; pointer-events: none; }
#tubes path { fill: none; stroke-linecap: round; transition: stroke 220ms ease, opacity 220ms ease; }
#tubes .tube { stroke: var(--pb-edge); }
#tubes .tube.trail { stroke: var(--pb-edge-strong); }
#tubes .tube.whatif { stroke-dasharray: .1 10; }
#tubes .tube.faded, #tubes .wire.faded { opacity: .3; }
#tubes .bub { stroke: #fff; stroke-dasharray: .1 12; opacity: 0; transition: opacity 200ms ease; }
#tubes .bub.flow { opacity: 1; animation: bubbles .7s linear infinite; }
#tubes .wire { stroke-width: 4; }
#knobs { position: absolute; left: 0; top: 0; z-index: 3; }
.wk { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 11px; background: #fff; box-shadow: inset 0 0 0 2px var(--kd); display: grid; place-items: center; transition: transform 140ms var(--ease-out), opacity 200ms ease; }
.wk .i { --s: 11px; --c: var(--kd); opacity: 0; transition: opacity 120ms ease; }
.wk.faded { opacity: .3; }
@media (hover: hover) and (pointer: fine) { .wk:hover { transform: scale(1.18); } .wk:hover .i { opacity: 1; } }

/* desks · radius 36 · padding 28 · label pill overlaps the top edge by 12 */
.desk { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 36px; background: var(--pb-desk); pointer-events: none; transition: box-shadow 200ms ease, opacity 220ms ease; }
.desk.empty { background: var(--pb-desk); box-shadow: inset 0 0 0 2px #DDD3EE; }
.desk.empty::after { content: 'Drop sources here to add them to this question only'; position: absolute; left: 24px; right: 24px; bottom: 18px; text-align: center; font-size: 12px; color: var(--t3); }
.desk.hot { box-shadow: 0 0 0 3px var(--pb-edge-strong); }
.desk.pick { box-shadow: 0 0 0 3px var(--pb-edge-strong); animation: pulse 1.4s ease-in-out infinite; }
.desk.pick.hot { box-shadow: 0 0 0 4px var(--pb-ink); animation: none; }
.desk.faded { opacity: .45; }
.desk .tab { position: absolute; left: 20px; top: -12px; height: 26px; padding: 0 10px 0 4px; border-radius: 999px; background: #fff; box-shadow: var(--sh-float); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.qchip { font-size: 10px; font-weight: 700; background: var(--pb-ink); color: #fff; padding: 3px 7px; border-radius: 999px; text-decoration: underline; text-underline-offset: 2px; }
.qchip.soft { background: var(--pb-lilac); color: var(--t1); }
.desk .tab .lb { font-size: 11px; font-weight: 600; } .desk .tab .up { font-size: 11px; color: var(--t2); }
.dots { display: inline-flex; align-items: center; } .dots i { width: 10px; height: 10px; border-radius: 5px; border: 1.5px solid #fff; margin-left: -4px; } .dots i:first-child { margin-left: 0; }
.desk .tab .dots i { width: 9px; height: 9px; }

/* nodes */
.card { position: absolute; left: 0; top: 0; will-change: transform; z-index: 2; user-select: none; -webkit-user-select: none; transition: opacity 220ms ease, filter 220ms ease; transform-origin: 50% 40%; }
.card.faded { opacity: .38; }
.card.muted { opacity: .45; filter: saturate(.6); }
@media (hover: hover) and (pointer: fine) { .card.muted:hover { opacity: .85; filter: none; } }
.face { position: relative; border-radius: 20px; box-shadow: var(--sh-node); cursor: grab; transition: box-shadow 240ms var(--ease-out), transform 240ms var(--ease-out), background-color 300ms ease; }
.card.lift .face { box-shadow: var(--sh-lift); cursor: grabbing; }
.card.selected .face { box-shadow: 0 0 0 2px var(--pb-ink), 0 14px 28px -12px rgba(43,35,64,.34); transform: translateY(-2px); }
.card.reading .face { box-shadow: 0 0 0 3px var(--pb-edge-strong), var(--sh-node); }
.card.drop .face { box-shadow: 0 0 0 3px var(--pb-ink), var(--sh-lift); }

/* source node · 212 wide · padding 12 · radius 20 */
.src .face { background: var(--fc); }
.sn { display: flex; gap: 10px; padding: 12px; }
.tile { width: 44px; height: 44px; flex: none; border-radius: 12px; background: #fff; display: grid; place-items: center; position: relative; }
.tile .i { --s: 18px; --c: var(--fd); }
.tile img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.tile .badge { position: absolute; right: -5px; top: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pb-ink); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.sx { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.meta { font-size: 10px; font-weight: 600; color: var(--fd); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.meta .i { --s: 10px; --c: var(--fd); }
.ttl { font-size: 13.5px; font-weight: 600; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.exr { display: flex; gap: 6px; align-items: flex-start; margin-top: 2px; }
.chipl { font-size: 9.5px; font-weight: 600; background: var(--fk); color: var(--fkt); padding: 2px 5px; border-radius: 6px; flex: none; }
.exr span:last-child { font-size: 11.5px; line-height: 1.35; color: var(--fx); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dsc { font-size: 11px; line-height: 1.3; color: var(--fx); opacity: .85; font-style: italic; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.ask-desc { align-self: flex-start; margin-top: 4px; font-size: 10.5px; font-weight: 600; color: var(--fd); text-decoration: underline; text-underline-offset: 2px; }
/* note: no tile */
.note-in { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.note-in .n { font-size: 13.5px; line-height: 1.4; outline: none; cursor: text; user-select: text; -webkit-user-select: text; min-height: 38px; }
.note-in .n:empty::before { content: 'Write a note…'; color: var(--t3); }
/* processing: lilac until typed */
.src.processing .face { background: var(--pb-lilac); box-shadow: none; }
.src.processing .tile { background: linear-gradient(90deg, #fff 0%, #F5F2FA 50%, #fff 100%); background-size: 200% 100%; animation: pbshimmer 1.4s linear infinite; }
.src.processing .meta { color: var(--t3); } .src.processing .ttl { color: var(--t2); }
.prog { height: 4px; border-radius: 2px; background: #fff; overflow: hidden; margin-top: 3px; } .prog i { display: block; height: 100%; border-radius: 2px; background: var(--pb-edge-strong); animation: grow 2s var(--ease-out) forwards; }
/* failed: white, pink ring, plain fix */
.src.failed .face { background: #fff; box-shadow: 0 0 0 2px var(--failed-ring); }
.src.failed .tile { background: var(--failed-tile); } .src.failed .tile .i { --c: var(--failed); }
.src.failed .meta { color: var(--failed); }
.fix { font-size: 11.5px; color: var(--t2); margin-top: 2px; } .fix button { text-decoration: underline; text-underline-offset: 2px; }
/* opened */
.l { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.l .top { display: flex; gap: 10px; }
.exl { background: color-mix(in srgb, var(--fc) 45%, #fff); border-radius: 12px; padding: 4px; display: flex; flex-direction: column; gap: 2px; }
.exl button { display: flex; gap: 6px; align-items: flex-start; text-align: left; padding: 6px 6px; border-radius: 9px; font-size: 11.5px; line-height: 1.4; color: var(--fx); transition: background-color 150ms ease, opacity 200ms ease; }
.exl button.off { opacity: .45; } .exl button.off span:last-child { text-decoration: line-through; }
@media (hover: hover) and (pointer: fine) { .exl button:hover { background: #fff; } }
.desc { width: 100%; border: 0; outline: none; resize: none; border-radius: 12px; background: #fff; padding: 8px 10px; font-size: 11.5px; line-height: 1.4; min-height: 36px; cursor: text; user-select: text; -webkit-user-select: text; transition: box-shadow 150ms ease; }
.desc:focus { box-shadow: 0 0 0 2px var(--fd); } .desc::placeholder { color: var(--t3); }
.lfoot { display: flex; gap: 4px; align-items: center; }
.upill { font-size: 10px; font-weight: 500; background: #fff; color: var(--t1); padding: 3px 8px; border-radius: 999px; }
.lfoot .done { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--fd); }
/* stack: sheets drop down, one tone darker each */
.sheet { position: absolute; border-radius: 20px; background: var(--fc); }
.sheet.s2 { left: 8px; right: 8px; top: 14px; bottom: -14px; filter: brightness(.86); }
.sheet.s1 { left: 4px; right: 4px; top: 7px; bottom: -7px; filter: brightness(.93); }
/* S pill at low zoom */
.s { height: 48px; border-radius: 24px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 6px; }
.s .tile { width: 36px; height: 36px; border-radius: 18px; }
.s .t { flex: 1; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.size-s .face { border-radius: 24px; } .card.size-s .sheet { border-radius: 24px; }
/* hover tools on source nodes */
.tools { position: absolute; right: 8px; top: -12px; display: flex; gap: 3px; opacity: 0; transform: translateY(3px); transition: opacity 140ms ease-out, transform 160ms var(--ease-out); z-index: 3; }
.card.selected .tools { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) { .card:hover .tools { opacity: 1; transform: none; } }
.ic { width: 26px; height: 26px; border-radius: 13px; background: #fff; box-shadow: var(--sh-float); display: grid; place-items: center; transition: transform 120ms var(--ease-out), background-color 150ms ease; }
.ic .i { --s: 12px; --c: var(--pb-ink); }
.ic:active { transform: scale(.9); }
@media (hover: hover) and (pointer: fine) { .ic:hover { background: var(--pb-lilac); } }

/* chat node · white · radius 20 · padding 14 */
.chat .face { background: var(--pb-card); box-shadow: var(--sh-card); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.chat.selected .face { box-shadow: 0 0 0 2px var(--pb-ink), var(--sh-card); }
.chd { display: flex; align-items: center; gap: 6px; min-height: 20px; }
.mdot { width: 9px; height: 9px; border-radius: 5px; background: var(--c); flex: none; }
.mtag { font-size: 10.5px; font-weight: 600; white-space: nowrap; } .mtag u { text-underline-offset: 2px; }
.ptag { vertical-align: 2px; font-size: 9.5px; font-weight: 600; background: var(--pb-lilac); color: var(--t2); padding: 2px 6px; border-radius: 999px; white-space: nowrap; }
.chd .sp { flex: 1; }
.apill { display: inline-flex; gap: 3px; align-items: center; font-size: 9.5px; font-weight: 500; padding: 3px 6px; border-radius: 999px; border: 1px solid var(--pb-lilac); background: #fff; white-space: nowrap; transition: background-color 150ms ease, transform 120ms var(--ease-out); }
.apill .i { --s: 9px; --c: var(--pb-ink); }
.apill:active { transform: scale(.95); }
@media (hover: hover) and (pointer: fine) { .apill:hover { background: var(--pb-lilac); } }
.chat .ttl { font-size: 15px; font-weight: 700; line-height: 1.25; -webkit-line-clamp: 3; }
.cbody { max-height: 280px; overflow: auto; display: flex; flex-direction: column; gap: 10px; cursor: auto; user-select: text; -webkit-user-select: text; scrollbar-width: thin; scrollbar-color: var(--pb-edge) transparent; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
.cbody.short { -webkit-mask-image: none; mask-image: none; }
.qb { background: var(--pb-lilac); border-radius: 14px; padding: 9px 12px; font-size: 11.5px; line-height: 1.45; }
.ans { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; line-height: 1.5; color: var(--t2); }
.ans h3 { margin: 4px 0 0; font-size: 11.5px; font-weight: 700; color: var(--t1); } .ans h3:first-child { margin-top: 0; }
.ans p { margin: 0; } .ans ol { margin: 0; padding-left: 16px; } .ans b { color: var(--t1); font-weight: 600; }
.ans.live p:last-child::after { content: ''; display: inline-block; width: 6px; height: 12px; margin-left: 2px; vertical-align: -2px; border-radius: 2px; background: var(--pb-edge-strong); animation: caret 900ms steps(1) infinite; }
.ans .changed { align-self: flex-start; margin-top: 4px; font-size: 10px; font-weight: 600; background: #FFF0B3; color: #5A4300; padding: 3px 8px; border-radius: 999px; }
.thinking { background: var(--pb-lilac); border-radius: 14px; padding: 9px 12px; font-size: 11.5px; display: flex; gap: 8px; align-items: center; color: var(--t2); }
.thinking i { width: 8px; height: 8px; border-radius: 4px; background: var(--pb-edge-strong); animation: think 1s ease-in-out infinite; }
.skel { display: flex; flex-direction: column; gap: 6px; } .skel i { height: 8px; border-radius: 4px; background: var(--pb-lilac); }
.cfoot { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--t2); }
.cfoot .sp { flex: 1; }
.stale { font-size: 10px; font-weight: 600; color: #8A5A00; background: #FFF0D6; padding: 2px 7px; border-radius: 999px; display: inline-flex; gap: 4px; align-items: center; }
.stale::before { content: ''; width: 6px; height: 6px; border-radius: 3px; background: var(--stale); }
.compose { display: none; align-items: flex-end; gap: 6px; cursor: auto; }
.card.chat.selected .compose, .card.chat.empty .compose { display: flex; }
.compose textarea { flex: 1; border: 0; outline: none; resize: none; background: var(--pb-lilac); border-radius: 14px; padding: 8px 12px; font-size: 11.5px; line-height: 1.45; min-height: 34px; max-height: 110px; }
.card.chat.empty .compose textarea { background: #fff; box-shadow: inset 0 0 0 1.5px var(--pb-edge); background-image: none; border: 0; }
.card.chat.empty .compose textarea { outline: 1.5px dashed var(--pb-edge); outline-offset: -1.5px; box-shadow: none; }
.compose textarea::placeholder { color: var(--t3); }
.send { width: 26px; height: 26px; border-radius: 13px; background: var(--pb-ink); display: grid; place-items: center; flex: none; margin-bottom: 4px; transition: transform 120ms var(--ease-out), background-color 150ms ease; }
.send .i { --s: 12px; --c: #fff; } .send:active { transform: scale(.9); } .send:disabled { background: #D6CDE6; cursor: default; }
.card.chat.size-s .face { padding: 0; }

/* =========================================================
   Canvas chrome · four floating pieces
   ========================================================= */
.float { background: #fff; box-shadow: var(--sh-float); }
#brand { position: fixed; top: 16px; left: 16px; z-index: 20; display: flex; align-items: center; gap: 12px; border-radius: 999px; padding: 8px 20px 8px 8px; }
#brand .lg { width: 40px; height: 40px; border-radius: 20px; background: var(--pb-ink); display: grid; place-items: center; }
#brand b { font-size: 20px; font-weight: 700; } #brand span { font-size: 16px; color: var(--t2); }
#rail { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 12px; border-radius: 36px; padding: 10px; }
#rail button { width: 56px; height: 56px; border-radius: 28px; display: grid; place-items: center; transition: transform 160ms var(--ease-out), box-shadow 160ms ease; }
#rail button .i { --s: 22px; }
#rail button:active { transform: scale(.92); }
#rail button.on { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--kd); }
@media (hover: hover) and (pointer: fine) { #rail button:hover { transform: scale(1.06); } }
#rail .sep { width: 28px; height: 2px; border-radius: 1px; background: var(--pb-lilac); }
#linkpop { position: fixed; z-index: 25; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 999px; opacity: 0; transform: translateX(-6px); pointer-events: none; transition: opacity 140ms ease-out, transform 180ms var(--ease-out); }
#linkpop.on { opacity: 1; transform: none; pointer-events: auto; }
#linkpop input { width: 300px; border: 0; outline: none; font-size: 14px; background: none; }
#linkpop .go { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--pb-ink); color: #fff; font-size: 13px; font-weight: 600; }
#trail { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 10px; border-radius: 999px; padding: 10px 20px; max-width: calc(100vw - 300px); overflow: hidden; }
#trail .lb { font-size: 16px; font-weight: 700; color: var(--t2); } #trail .hint { font-size: 16px; color: var(--t2); white-space: nowrap; }
#trail button { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
#trail button.here { font-weight: 600; } #trail .arr { color: var(--t3); }
#zoom { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; align-items: center; gap: 20px; border-radius: 28px; padding: 12px 22px; }
#zoom button { display: grid; place-items: center; } #zoom .i { --s: 16px; --c: var(--pb-ink); }
#zoom .z { font-size: 18px; font-weight: 600; min-width: 48px; text-align: center; }
#pickbar { position: fixed; top: 84px; left: 50%; transform: translate(-50%, -8px); z-index: 30; height: 44px; padding: 0 6px 0 18px; border-radius: 999px; background: var(--pb-ink); color: #fff; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 160ms ease-out, transform 200ms var(--ease-out); box-shadow: var(--sh-card); }
#pickbar.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#pickbar button { height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.14); font-size: 13px; }
#drop { position: fixed; inset: 12px; z-index: 60; border-radius: 40px; background: rgba(245,242,250,.86); box-shadow: inset 0 0 0 3px var(--pb-edge-strong); display: grid; place-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity 140ms ease; }
#drop.on { opacity: 1; }
#drop b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -.02em; } #drop span { font-size: 15px; color: var(--t2); }
.tip { position: fixed; z-index: 100; pointer-events: none; background: var(--pb-ink); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity 120ms ease-out; }
.tip.show { opacity: 1; }

<script>
/* ================= helpers ================= */
const LU = n => `url(https://unpkg.com/lucide-static@0.460.0/icons/${n}.svg)`;
const I = (n, c, s) => `<span class="i" style="--u:${LU(n)};${c ? `--c:${c};` : ''}${s ? `--s:${s}px;` : ''}"></span>`;
const hydrate = (r = document) => r.querySelectorAll('[data-i]').forEach(e => { e.style.setProperty('--u', LU(e.dataset.i)); e.removeAttribute('data-i'); });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const cut = (s, n) => (s = String(s || '')).length > n ? s.slice(0, n - 1).trim() + '…' : s;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const springs = new Set();
class Spring {
  constructor(v, r = .4, d = 1) { this.x = v; this.t = v; this.v = 0; this.cfg(r, d); springs.add(this); }
  cfg(r, d) { this.k = (2 * Math.PI / r) ** 2; this.c = 4 * Math.PI * d / r; return this; }
  to(t, vel) { this.t = t; if (vel !== undefined) this.v = vel; if (RM) this.snap(t); return this; }
  snap(v) { this.x = this.t = v; this.v = 0; return this; }
  kick(v) { if (!RM) this.v += v; return this; }
  step(dt) { const f = -this.k * (this.x - this.t) - this.c * this.v; this.v += f * dt; this.x += this.v * dt; }
}
const project = (v, d = .99) => (v / 1000) * d / (1 - d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clock = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

/* ================= types ================= */
const TYPES = {
  video: ['media', 'play', 'Video'], podcast: ['media', 'audio-lines', 'Audio'], pdf: ['docs', 'file-text', 'PDF'], note: ['note', 'sticky-note', 'Note'],
  web: ['web', 'globe', 'Web page'], csv: ['data', 'sheet', 'Spreadsheet'], image: ['image', 'image', 'Image'], event: ['place', 'calendar', 'Event'], stack: ['docs', 'layers', 'Pile'],
};
const FAMC = { media: ['#FFD9C7', '#E0673A'], docs: ['#FFF0B3', '#B8860B'], note: ['#FFE1EA', '#D1467E'], web: ['#C9ECFF', '#2A86C4'], data: ['#D4F2C9', '#3F9A2E'], image: ['#E6DBFF', '#7A52D6'], place: ['#C8F0EA', '#1F9483'], mixed: ['#EFE9F8', '#6E6585'], answer: ['#EFE9F8', '#6E6585'] };
const MODELS = { claude: ['Claude', '#E0673A'], gpt: ['GPT', '#3FAE5A'], gemini: ['Gemini', '#2A86C4'], llama: ['Llama (Groq)', '#7A52D6'], deepseek: ['DeepSeek', '#3B6FD8'], mistral: ['Mistral', '#E2A72A'], kimi: ['Kimi', '#D1467E'] };
const PERSONAS = { none: ['Just answer', ''], skeptic: ['Skeptic', 'Push back. Look for what could be wrong and say how sure you are.'], teacher: ['Teacher', "Explain step by step with one small example, as if I'm new to this."], coach: ['Coach', 'Ask me one good question back before you answer.'], analyst: ['Analyst', 'Be brief. Numbers first, then the reasoning.'] };
const DEFAULT_ADV = { temp: null, maxOut: null, hist: 'auto', k: 6, topK: 5, budget: null };

/* ================= state ================= */
const vp = document.getElementById('vp'), world = document.getElementById('world'), TB = document.getElementById('tubes'), KN = document.getElementById('knobs'), NS = 'http://www.w3.org/2000/svg';
const nodes = new Map(), tubes = [], desks = [];
let selected = null, zTop = 10, uid = 100, size = 'M', pick = null;
const cam = { x: new Spring(0, .5, 1), y: new Spring(0, .5, 1), z: new Spring(1, .45, 1) };
const isChat = n => !!n && n.kind === 'chat';
const chats = () => [...nodes.values()].filter(isChat);
const sources = () => [...nodes.values()].filter(n => !isChat(n));
const kids = id => chats().filter(c => c.parent === id);
const ancestors = id => { const o = []; let c = nodes.get(id); while (c && c.parent) { c = nodes.get(c.parent); if (c) o.push(c); } return o; };
const deskOf = id => sources().filter(n => n.desk === id);
const famOf = n => { if (isChat(n)) return 'answer'; if (n.type === 'stack') { const f = TYPES[n.members[0]?.type || 'pdf'][0]; return n.members.every(m => TYPES[m.type][0] === f) ? f : 'mixed'; } return TYPES[n.type][0]; };
const iconOf = n => isChat(n) ? 'message-circle' : TYPES[n.type][1];
const qNum = c => !c.parent ? 'Q' + (chats().filter(x => !x.parent).indexOf(c) + 1) : qNum(nodes.get(c.parent)) + '.' + (kids(c.parent).indexOf(c) + 1);
const nameOf = n => isChat(n) ? `${qNum(n)} answer` : n.title || cut(n.text || 'Note', 34);
const onEx = n => n.type === 'stack' ? n.members.filter(m => !m.off) : (n.ex || []).filter(e => e.on);
const dotsHTML = list => `<span class="dots">${list.slice(0, 6).map(n => `<i style="background:${FAMC[famOf(n)][1]}"></i>`).join('')}</span>`;
function tokensOf(n) {
  if (isChat(n)) return 420;
  if (n.status !== 'ready') return 0;
  const desc = Math.round((n.desc || '').length / 4);
  return desc + (n.type === 'note' ? Math.max(20, Math.round((n.text || '').length / 4)) : n.type === 'stack' ? onEx(n).length * 1400 : n.type === 'image' ? 300 : onEx(n).length * 450 + 200);
}
// What a chat reads: its desk, anything wired straight to it, answers it uses, then the context above (unless it started fresh or left something out).
function ctx(id) {
  const c = nodes.get(id); if (!c) return [];
  const own = [
    ...deskOf(id).map(n => ({ n, via: id, how: 'desk' })),
    ...sources().filter(n => n.links?.has(id) && n.desk !== id).map(n => ({ n, via: id, how: 'wire' })),
    ...[...(c.uses || [])].map(x => nodes.get(x)).filter(Boolean).map(n => ({ n, via: id, how: 'answer' })),
  ].map(x => ({ ...x, inherited: false, hidden: false }));
  const up = c.parent && c.inheritDesk !== false ? ctx(c.parent).filter(x => !x.hidden && !own.some(o => o.n === x.n)).map(x => ({ ...x, inherited: true, hidden: !!c.hide?.has(x.n.id) })) : [];
  return [...own, ...up];
}
const readsOf = id => ctx(id).filter(x => !x.hidden && (isChat(x.n) || x.n.status === 'ready')).map(x => x.n);
const subtree = id => 1 + kids(id).reduce((a, k) => a + subtree(k.id), 0);
const tubeW = id => 4 + 1.8 * (Math.sqrt(subtree(id)) - 1);   // trunk thicker, leaves 4px

/* ================= nodes ================= */
function addNode(d, { pop = false } = {}) {
  const el = document.createElement('div'); el.dataset.id = d.id; el.tabIndex = 0; world.appendChild(el);
  const n = Object.assign({ status: 'ready' }, d, { el, px: new Spring(d.x, .4, 1), py: new Spring(d.y, .4, 1), s: new Spring(pop ? .8 : 1, .42, pop ? .55 : 1), o: new Spring(pop ? 0 : 1, .25, 1), rot: new Spring(0, .5, .3), h: 80 });
  if (isChat(n)) { n.w = 320; n.hide = n.hide || new Set(); n.uses = n.uses || new Set(); n.adv = Object.assign({}, DEFAULT_ADV, n.adv || {}); if (n.inheritDesk === undefined) n.inheritDesk = true; n.carry = n.carry || 'summary'; n.at = n.at || 'Today ' + clock(); }
  else { n.w = 212; n.links = n.links || new Set(); }
  if (pop) { n.s.to(1); n.o.to(1); }
  nodes.set(n.id, n); render(n);
  new ResizeObserver(() => n.h = el.offsetHeight).observe(el);
